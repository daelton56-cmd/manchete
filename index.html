<script type="module">
// Manchete: ponte com o Firebase (login por e-mail e senha + banco Firestore)
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, updateProfile, deleteUser, EmailAuthProvider, reauthenticateWithCredential } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, doc, collection, setDoc, getDoc, getDocs, deleteDoc, updateDoc, onSnapshot, writeBatch, arrayUnion, arrayRemove, query, where, deleteField, limit } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp(window.MANCHETE_FIREBASE);
const auth = initializeAuth(app, { persistence: [indexedDBLocalPersistence, browserLocalPersistence] });
let fs;
try { fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }) }); }
catch (e) { fs = initializeFirestore(app, {}); }

const userOf = u => u ? { uid: u.uid, email: u.email || '', name: u.displayName || (u.email || '').split('@')[0] } : null;
const fail = e => { const x = new Error((e && e.message) || 'erro'); x.code = (e && e.code) || 'unknown'; return x; };
const wrap = s => ({ docs: s.docs.map(d => ({ id: d.id, exists: true, data: () => d.data() })), size: s.size, empty: s.empty, metadata: { fromCache: s.metadata.fromCache, hasPendingWrites: s.metadata.hasPendingWrites } });
const code = () => { const a = new Uint8Array(10); crypto.getRandomValues(a); return Array.from(a, x => 'abcdefghjkmnpqrstuvwxyz23456789'[x % 31]).join(''); };
const guard = p => p.catch(e => { throw fail(e); });

window.MCloud = {
  onAuth: cb => onAuthStateChanged(auth, u => cb(userOf(u))),
  async signUp(name, email, pass) {
    try {
      const c = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(c.user, { displayName: name });
      await setDoc(doc(fs, 'users', c.user.uid), { name }, { merge: true });
      return { uid: c.user.uid, email, name };
    } catch (e) { throw fail(e); }
  },
  signIn: (email, pass) => guard(signInWithEmailAndPassword(auth, email, pass).then(c => userOf(c.user))),
  resetPassword: email => guard(sendPasswordResetEmail(auth, email)),
  signOut: () => guard(signOut(auth)),
  getUser: uid => guard(getDoc(doc(fs, 'users', uid)).then(s => (s.exists() ? s.data() : null))),
  setUser: (uid, data) => guard(setDoc(doc(fs, 'users', uid), data, { merge: true })),
  async createTurma(name, me) {
    const ref = doc(collection(fs, 'turmas'));
    const c = code();
    const b = writeBatch(fs);
    b.set(ref, { name, ownerUid: me.uid, admins: [me.uid], inviteCode: c, created: Date.now(), privacyV: 2 });
    b.set(doc(fs, 'turmas', ref.id, 'membros', me.uid), { uid: me.uid, joinedAt: Date.now(), code: c });
    b.set(doc(fs, 'users', me.uid), { lastTurma: ref.id, turmas: arrayUnion(ref.id) }, { merge: true });
    await guard(b.commit());
    return { id: ref.id, inviteCode: c };
  },
  async joinTurma(t, c, me, by) {
    const mref = doc(fs, 'turmas', t, 'membros', me.uid);
    let already = false;
    try { already = (await getDoc(mref)).exists(); } catch (e) { already = false; }
    if (!already) await guard(setDoc(mref, Object.assign({ uid: me.uid, joinedAt: Date.now(), code: c }, by ? { by } : {})));
    await guard(setDoc(doc(fs, 'users', me.uid), { lastTurma: t, turmas: arrayUnion(t) }, { merge: true }));
    return !already;
  },
  // ---------- Busca de pessoas ----------
  setPublicProfile: (uid, data) => guard(setDoc(doc(fs, 'perfisPublicos', uid), data)),
  getPublicProfile: uid => guard(getDoc(doc(fs, 'perfisPublicos', uid)).then(s => (s.exists() ? { uid: s.id, ...s.data() } : null))),
  searchPeople: ({ key, emailHash }) => guard(getDocs(query(collection(fs, 'perfisPublicos'), emailHash ? where('emailHash', '==', emailHash) : where('keys', 'array-contains', key), limit(20)))
    .then(s => s.docs.map(d => ({ uid: d.id, ...d.data() })))),
  // ---------- Jogos abertos ----------
  watchAbertos: (mode, uid, next, error) => onSnapshot(query(collection(fs, 'abertos'), mode === 'todos' ? where('vis', '==', 'todos') : where('rede', 'array-contains', uid)), s => next(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => error && error(fail(e))),
  abertoSet: (gid, data) => guard(setDoc(doc(fs, 'abertos', gid), data)),
  abertoConf: (gid, conf) => guard(updateDoc(doc(fs, 'abertos', gid), { conf, updated: Date.now() })),
  abertoDel: gid => guard(deleteDoc(doc(fs, 'abertos', gid))),
  pedidoSet: (gid, uid, data) => guard(setDoc(doc(fs, 'abertos', gid, 'pedidos', uid), data)),
  pedidoUpdate: (gid, uid, patch) => guard(updateDoc(doc(fs, 'abertos', gid, 'pedidos', uid), patch)),
  watchPedidos: (gid, next, error) => onSnapshot(collection(fs, 'abertos', gid, 'pedidos'), s => next(s.docs.map(d => ({ uid: d.id, ...d.data() }))), e => error && error(fail(e))),
  watchPedido: (gid, uid, next, error) => onSnapshot(doc(fs, 'abertos', gid, 'pedidos', uid), s => next(s.exists() ? { uid: s.id, ...s.data() } : null), e => error && error(fail(e))),
  denunciar: data => guard(setDoc(doc(collection(fs, 'denuncias')), data)),
  // ---------- Amistosos (partidas sem turma ou de várias turmas) ----------
  watchPartidas: (uid, next, error) => onSnapshot(query(collection(fs, 'partidas'), where('visibleTo', 'array-contains', uid)), s => next(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => error && error(fail(e))),
  partidaCreate: (id, data) => guard(setDoc(doc(fs, 'partidas', id), data)),
  // Quem marcou atualiza a partida sem tocar em presença, nomes e votos dos outros.
  partidaSave: (id, data) => { const d = { ...data }; delete d.conf; delete d.votes; delete d.roster; return guard(setDoc(doc(fs, 'partidas', id), d, { mergeFields: Object.keys(d) })); },
  partidaPresence: (id, uid, on, info) => guard(updateDoc(doc(fs, 'partidas', id), on ? { conf: arrayUnion(uid), [`roster.${uid}`]: info } : { conf: arrayRemove(uid), [`roster.${uid}`]: deleteField() })),
  partidaVote: (id, uid, pid) => guard(updateDoc(doc(fs, 'partidas', id), { [`votes.${uid}`]: pid })),
  partidaDelete: id => guard(deleteDoc(doc(fs, 'partidas', id))),
  listMembers: t => guard(getDocs(collection(fs, 'turmas', t, 'membros')).then(s => s.docs.map(d => d.id))),
  // ---------- Amizades ----------
  watchFriendships: (uid, next, error) => onSnapshot(query(collection(fs, 'friendships'), where('users', 'array-contains', uid)), s => next(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => error && error(fail(e))),
  friendSet: (id, data) => guard(setDoc(doc(fs, 'friendships', id), data)),
  friendAccept: id => guard(updateDoc(doc(fs, 'friendships', id), { status: 'accepted', acceptedAt: Date.now() })),
  friendRemove: id => guard(deleteDoc(doc(fs, 'friendships', id))),
  watchMirrors: (uid, next, error) => onSnapshot(collection(fs, 'users', uid, 'amigos'), s => next(s.docs.map(d => ({ uid: d.id, ...d.data() }))), e => error && error(fail(e))),
  getMirrors: uid => guard(getDocs(collection(fs, 'users', uid, 'amigos')).then(s => s.docs.map(d => ({ uid: d.id, ...d.data() })))),
  mirrorSet: (owner, friend, info) => guard(setDoc(doc(fs, 'users', owner, 'amigos', friend), info)),
  mirrorDelete: (owner, friend) => guard(deleteDoc(doc(fs, 'users', owner, 'amigos', friend))),
  // Grava várias mudanças em lotes pequenos: o Firebase limita quantas checagens de regra cabem num lote.
  async batch(ops, size = 4) {
    for (let i = 0; i < ops.length; i += size) {
      const b = writeBatch(fs);
      for (const op of ops.slice(i, i + size)) {
        const ref = doc(fs, ...op.path.split('/'));
        if (op.op === 'delete') b.delete(ref);
        else if (op.op === 'strip') b.update(ref, Object.fromEntries(op.fields.map(f => [f, deleteField()])));
        else b.set(ref, op.data, op.merge ? { merge: true } : undefined);
      }
      await guard(b.commit());
    }
  },
  async deleteAccount(pass) {
    const u = auth.currentUser;
    if (!u) throw fail({ code: 'auth/no-current-user' });
    try { await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, pass)); } catch (e) { throw fail(e); }
    let turmas = [];
    try { const s = await getDoc(doc(fs, 'users', u.uid)); turmas = (s.exists() && s.data().turmas) || []; } catch (e) { }
    try {
      const fr = await getDocs(query(collection(fs, 'friendships'), where('users', 'array-contains', u.uid)));
      for (const d of fr.docs) { const o = (d.data().users || []).find(x => x !== u.uid); try { await deleteDoc(d.ref); } catch (e) { } if (o) { try { await deleteDoc(doc(fs, 'users', o, 'amigos', u.uid)); } catch (e) { } } }
      const mine = await getDocs(collection(fs, 'users', u.uid, 'amigos'));
      for (const d of mine.docs) { try { await deleteDoc(d.ref); } catch (e) { } }
    } catch (e) { }
    for (const t of turmas) {
      try { await deleteDoc(doc(fs, 'turmas', t, 'profiles', u.uid)); } catch (e) { }
      try { await deleteDoc(doc(fs, 'turmas', t, 'convites', u.uid)); } catch (e) { }
      try {
        const gs = await getDocs(collection(fs, 'turmas', t, 'games'));
        for (const g of gs.docs) { try { await deleteDoc(doc(fs, 'turmas', t, 'games', g.id, 'roster', u.uid)); } catch (e) { } }
      } catch (e) { }
      try { await setDoc(doc(fs, 'turmas', t, 'players', u.uid), { name: deleteField(), nick: deleteField(), photo: deleteField(), height: deleteField(), birthYear: deleteField() }, { merge: true }); } catch (e) { }
      try { await deleteDoc(doc(fs, 'turmas', t, 'photos', u.uid)); } catch (e) { }
      try { await deleteDoc(doc(fs, 'turmas', t, 'membros', u.uid)); } catch (e) { }
    }
    try { await deleteDoc(doc(fs, 'perfisPublicos', u.uid)); } catch (e) { }
    try { await deleteDoc(doc(fs, 'users', u.uid)); } catch (e) { }
    await guard(deleteUser(u));
  },
  async leaveTurma(t, uid) {
    try { await updateDoc(doc(fs, 'turmas', t), { admins: arrayRemove(uid), [`adminMeta.${uid}`]: deleteField() }); } catch (e) { }
    await guard(deleteDoc(doc(fs, 'turmas', t, 'membros', uid)));
    await guard(setDoc(doc(fs, 'users', uid), { turmas: arrayRemove(t), lastTurma: null }, { merge: true }));
  },
  async listTurmas(uid) {
    let ids = [];
    try { const s = await getDoc(doc(fs, 'users', uid)); ids = (s.exists() && s.data().turmas) || []; } catch (e) { }
    const out = [];
    for (const id of ids) { try { const s = await getDoc(doc(fs, 'turmas', id)); if (s.exists()) out.push({ id, ...s.data() }); } catch (e) { } }
    return out;
  },
  renameTurma: (t, name) => guard(updateDoc(doc(fs, 'turmas', t), { name })),
  // Pagamentos: a configuração fica na turma (só admin grava). A situação de cada um fica numa ficha privada,
  // na coleção de partidas, que só a pessoa e os admins leem; cada um grava só a própria parte.
  setPay: (t, pay) => guard(updateDoc(doc(fs, 'turmas', t), { pay })),
  pagoEntry: async (id, uid, entry, create) => {
    try { await updateDoc(doc(fs, 'partidas', id), { [`roster.${uid}`]: entry }); }
    catch (e) {
      if (create && e && e.code === 'not-found') { await guard(setDoc(doc(fs, 'partidas', id), { ...create, roster: { [uid]: entry } })); return; }
      throw fail(e);
    }
  },
  pagoVis: (id, visibleTo) => guard(setDoc(doc(fs, 'partidas', id), { visibleTo }, { mergeFields: ['visibleTo'] })),
  // Admin, como no WhatsApp: qualquer admin promove ou dispensa; quem criou a turma continua sempre.
  setAdmin: (t, uid, on, meta) => guard(updateDoc(doc(fs, 'turmas', t), on ? { admins: arrayUnion(uid), [`adminMeta.${uid}`]: meta } : { admins: arrayRemove(uid), [`adminMeta.${uid}`]: deleteField() })),
  // Apaga a turma inteira: partidas, cartas e membros primeiro, e por último a própria turma.
  async deleteTurma(t, uid) {
    const refs = [];
    const gs = await guard(getDocs(collection(fs, 'turmas', t, 'games')));
    for (const g of gs.docs) { const r = await guard(getDocs(collection(fs, 'turmas', t, 'games', g.id, 'roster'))); r.docs.forEach(d => refs.push(d.ref)); }
    for (const kind of ['games', 'photos', 'profiles', 'convites', 'backups', 'players', 'membros']) {
      const s = await guard(getDocs(collection(fs, 'turmas', t, kind)));
      s.docs.forEach(d => { if (!(kind === 'membros' && d.id === uid)) refs.push(d.ref); });
    }
    for (let i = 0; i < refs.length; i += 4) { const b = writeBatch(fs); refs.slice(i, i + 4).forEach(r => b.delete(r)); await guard(b.commit()); }
    const b = writeBatch(fs);
    b.delete(doc(fs, 'turmas', t, 'membros', uid));
    b.delete(doc(fs, 'turmas', t));
    b.set(doc(fs, 'users', uid), { turmas: arrayRemove(t), lastTurma: null }, { merge: true });
    await guard(b.commit());
  },
  removeMember: async (t, uid) => {
    try { await updateDoc(doc(fs, 'turmas', t), { admins: arrayRemove(uid), [`adminMeta.${uid}`]: deleteField() }); } catch (e) { }
    return guard(deleteDoc(doc(fs, 'turmas', t, 'membros', uid)));
  },
  async newInvite(t) { const c = code(); await guard(updateDoc(doc(fs, 'turmas', t), { inviteCode: c })); return c; },
  watchTurma: (t, next, error) => onSnapshot(doc(fs, 'turmas', t), s => next(s.exists() ? { id: s.id, ...s.data() } : null), e => error && error(fail(e))),
  watchMembers: (t, next, error) => onSnapshot(collection(fs, 'turmas', t, 'membros'), s => next(s.docs.map(d => d.data())), e => error && error(fail(e))),
  db(t) {
    return {
      // includeMetadataChanges: sem isso o Firebase não avisa quando a cópia do celular já bate com o servidor.
      collection: kind => ({ onSnapshot: (next, error) => onSnapshot(collection(fs, 'turmas', t, kind), { includeMetadataChanges: true }, s => next(wrap(s)), e => error && error(fail(e))) }),
      doc: path => {
        const [kind, id] = path.split('/');
        const ref = doc(fs, 'turmas', t, kind, id);
        return {
          // Partida: a presença (conf) nunca é sobrescrita aqui, só muda por presence/setConf.
          // partial: grava só os campos enviados, sem tocar no resto do documento.
          set: (data, partial) => {
            if (kind !== 'games') return guard(partial ? setDoc(ref, data, { mergeFields: Object.keys(data) }) : setDoc(ref, data));
            const d = { ...data }; delete d.conf; delete d.confirms; delete d.votes; delete d.rates;
            if (!Object.keys(d).length) return Promise.resolve();
            return guard(setDoc(ref, d, { mergeFields: Object.keys(d) }));
          },
          delete: () => guard(deleteDoc(ref))
        };
      },
      presence: (gid, pid, on) => guard(updateDoc(doc(fs, 'turmas', t, 'games', gid), { conf: on ? arrayUnion(pid) : arrayRemove(pid) })),
      setConf: (gid, conf) => guard(updateDoc(doc(fs, 'turmas', t, 'games', gid), { conf })),
      // Confirmação do placar: cada um só grava a própria, presa à versão atual do placar.
      confirm: (gid, uid, rev) => guard(updateDoc(doc(fs, 'turmas', t, 'games', gid), { [`confirms.${uid}`]: rev })),
      // Voto no MVP da galera: cada um grava só o próprio voto.
      vote: (gid, uid, pid) => guard(updateDoc(doc(fs, 'turmas', t, 'games', gid), { [`votes.${uid}`]: pid })),
      // Nota da galera: cada um grava só as próprias notas.
      rate: (gid, uid, map) => guard(updateDoc(doc(fs, 'turmas', t, 'games', gid), { [`rates.${uid}`]: map })),
      // Trava das notas iniciais depois do primeiro jogo que vale.
      lockCard: pid => guard(updateDoc(doc(fs, 'turmas', t, 'players', pid), { locked: true })),
      // Foto grande fica separada da carta e só é baixada quando alguém abre a foto.
      getPhoto: pid => guard(getDoc(doc(fs, 'turmas', t, 'photos', pid)).then(s => (s.exists() ? s.data().big || '' : ''))),
      setPhoto: (pid, big) => guard(setDoc(doc(fs, 'turmas', t, 'photos', pid), { big, updated: Date.now() })),
      deletePhoto: pid => guard(deleteDoc(doc(fs, 'turmas', t, 'photos', pid))),
      // Perfil protegido (nome, apelido, foto, altura e idade).
      watchProfiles: (next, error) => onSnapshot(collection(fs, 'turmas', t, 'profiles'), s => next(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => error && error(fail(e))),
      watchProfile: (pid, next, error) => onSnapshot(doc(fs, 'turmas', t, 'profiles', pid), s => next(s.exists() ? { id: s.id, ...s.data() } : null), e => error && error(fail(e))),
      setProfile: (pid, data) => guard(setDoc(doc(fs, 'turmas', t, 'profiles', pid), data)),
      deleteProfile: pid => guard(deleteDoc(doc(fs, 'turmas', t, 'profiles', pid))),
      // Nome de quem está em cada partida.
      watchRoster: (gid, next, error) => onSnapshot(collection(fs, 'turmas', t, 'games', gid, 'roster'), s => next(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => error && error(fail(e))),
      setRoster: (gid, pid, data) => guard(setDoc(doc(fs, 'turmas', t, 'games', gid, 'roster', pid), data)),
      // Link pessoal de convite.
      getConvite: uid => guard(getDoc(doc(fs, 'turmas', t, 'convites', uid)).then(s => (s.exists() ? s.data().token || '' : ''))),
      setConvite: (uid, token) => guard(setDoc(doc(fs, 'turmas', t, 'convites', uid), { token, updated: Date.now() }))
    };
  }
};
window.dispatchEvent(new Event('mcloud-ready'));

</script>
