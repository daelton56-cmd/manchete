<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10294A">
<title>Manchete</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manchete">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#E7ECF3; --ink:#0F2240; --muted:#53647E; --line:rgba(15,34,64,.13); --line-strong:rgba(15,34,64,.28);
  --ball:#F7C531; --ball-ink:#2E2300; --zone:#D9541E; --pos:#14845A; --neg:#C2410C; --focus:#2D5BD8;
  --board:#10294A; --board-ink:#F3F6FB; --board-muted:#9DB0CB; --board-line:rgba(255,255,255,.11);
  --display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',Impact,sans-serif;
  --text:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --star-on:#EDB100; --star-off:rgba(15,34,64,.13);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D2240; --surface:#14305A; --surface-2:#1A3A68; --ink:#F1F5FB; --muted:#A3B5CF; --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.26);
    --ball:#F7C531; --ball-ink:#2E2300; --zone:#FF8A57; --pos:#4ADE9A; --neg:#FF9466; --focus:#9CC0FF;
    --board:#081A33; --board-line:rgba(255,255,255,.1); --star-on:#F7C531; --star-off:rgba(255,255,255,.15); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D2240; --surface:#14305A; --surface-2:#1A3A68; --ink:#F1F5FB; --muted:#A3B5CF; --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.26);
  --ball:#F7C531; --ball-ink:#2E2300; --zone:#FF8A57; --pos:#4ADE9A; --neg:#FF9466; --focus:#9CC0FF;
  --board:#081A33; --board-line:rgba(255,255,255,.1); --star-on:#F7C531; --star-off:rgba(255,255,255,.15); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--text); font-size:16px; line-height:1.45; -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit; color:inherit}
button,a,input,select,textarea,label{touch-action:manipulation}
button{cursor:pointer; border:0; background:none; padding:0}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px}
img{max-width:100%}
.wrap{max-width:560px; margin:0 auto; padding:0 16px calc(84px + env(safe-area-inset-bottom,0px))}

/* Topo */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line)}
.top-in{max-width:560px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px; min-height:56px}
.mark{font-family:var(--display); font-weight:900; font-size:30px; letter-spacing:.01em; line-height:1; flex:1; display:flex; align-items:center; gap:8px}
.mark i{display:inline-block; width:20px; height:20px; border-radius:50%; background:var(--ball); position:relative; overflow:hidden; flex:none}
.mark i::before,.mark i::after{content:""; position:absolute; border:2px solid var(--ball-ink); border-radius:50%; opacity:.55}
.mark i::before{width:24px; height:24px; left:-12px; top:-6px}
.mark i::after{width:24px; height:24px; right:-14px; top:4px}
.mode{font-size:12px; color:var(--muted); text-align:right; line-height:1.2}
.icon-btn{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--ink); border:1px solid var(--line)}
.icon-btn svg{width:20px; height:20px}
.me-btn{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; padding:0; box-shadow:0 0 0 2px var(--ball)}
.me-btn .av{width:36px; height:36px}
.me-card{display:grid; grid-template-columns:150px 1fr; gap:16px; align-items:center; margin-bottom:6px}
.board .btn.board-ghost{background:transparent; color:var(--board-ink); border:1px solid var(--board-line)}
.back{display:flex; align-items:center; gap:6px; font-weight:600; font-size:15px; padding:8px 4px; margin-left:-4px}
.back svg{width:18px; height:18px}

/* Abas */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs::after{content:""; position:absolute; left:0; right:0; top:100%; height:160px; background:var(--surface); pointer-events:none}
.tabs-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr)}
.tab{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0 9px; font-size:12px; font-weight:600; color:var(--muted)}
.tab svg{width:24px; height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--ink)}
.tab[aria-current="page"] span{box-shadow:inset 0 -2px 0 var(--ball)}

/* Tipografia */
h1,h2,h3{margin:0; font-weight:600}
.h-sec{font-family:var(--display); font-weight:800; font-size:24px; line-height:1.1; margin:26px 0 10px; letter-spacing:.005em}
.sub{color:var(--muted); font-size:14px}
.small{font-size:13px}
.num{font-family:var(--display); font-weight:800; letter-spacing:.01em}
p{margin:0 0 10px}

/* Botões */
.btn{text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:0 18px; border-radius:12px; font-weight:600; font-size:16px; background:var(--surface); border:1px solid var(--line-strong); color:var(--ink)}
.btn svg{width:18px; height:18px}
.btn-ball{background:var(--ball); color:var(--ball-ink); border-color:transparent}
.btn-ghost{background:transparent}
.btn-danger{color:var(--neg); border-color:currentColor; background:transparent}
.btn-block{width:100%}
.btn-sm{min-height:36px; padding:0 12px; font-size:14px; border-radius:10px}
.btn:disabled{opacity:.45; cursor:default}
.row{display:flex; gap:10px; align-items:center}
.row-wrap{display:flex; gap:8px; flex-wrap:wrap}
.spacer{flex:1}
.chip{display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--line-strong); font-size:14px; font-weight:600; background:transparent}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

/* Placar (hero) */
.board{background:var(--board); color:var(--board-ink); border-radius:18px; padding:18px 18px 16px; position:relative; overflow:hidden; margin-top:16px}
.board::before{content:""; position:absolute; inset:0; pointer-events:none;
  background:
   linear-gradient(var(--board-line),var(--board-line)) 50% 0/1px 100% no-repeat,
   linear-gradient(var(--board-line),var(--board-line)) 33% 0/1px 100% no-repeat,
   linear-gradient(var(--board-line),var(--board-line)) 67% 0/1px 100% no-repeat}
.board > *{position:relative}
.board-label{font-size:13px; color:var(--board-muted); font-weight:600}
.board-when{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:4px 0 6px}
.board-day{font-family:var(--display); font-weight:800; font-size:34px; line-height:.95}
.board-time{font-family:var(--display); font-weight:900; font-size:58px; line-height:.85; color:var(--ball)}
.board-place{color:var(--board-muted); font-size:15px; margin-bottom:14px}
.board .btn{background:var(--ball); color:var(--ball-ink); border-color:transparent}
.stack{display:flex; padding-left:8px}
.stack .av{margin-left:-8px; border:2px solid var(--board)}
.conf-line{display:flex; align-items:center; gap:10px; margin-bottom:14px; font-size:15px}

/* Avatares */
.av{width:32px; height:32px; border-radius:50%; overflow:hidden; display:grid; place-items:center; font-size:12px; font-weight:600; background:var(--surface-2); color:var(--ink); flex:none}
.av img{width:100%; height:100%; object-fit:cover}

/* Listas */
.list{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.item{display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:1px solid var(--line); width:100%; text-align:left; min-height:56px}
.item:first-child{border-top:0}
.item-main{flex:1; min-width:0}
.item-title{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item-sub{color:var(--muted); font-size:14px}
.chev{width:16px; height:16px; color:var(--muted); flex:none}
.date-box{width:48px; flex:none; text-align:center; border-right:1px solid var(--line); padding-right:10px}
.date-box b{display:block; font-family:var(--display); font-weight:800; font-size:26px; line-height:1}
.date-box span{font-size:12px; color:var(--muted); font-weight:600}
.pill{display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted)}
.pill-done{background:transparent; border:1px solid var(--line-strong)}

.empty{border:1px dashed var(--line-strong); border-radius:16px; padding:22px 18px; text-align:left}
.empty h3{font-family:var(--display); font-weight:800; font-size:24px; margin-bottom:6px}
.banner{border-radius:12px; padding:10px 14px; font-size:14px; margin-top:12px; background:var(--surface-2); display:flex; gap:10px; align-items:center}

/* Passos do jogo */
.game-head{padding-top:6px}
.game-title{font-family:var(--display); font-weight:800; font-size:34px; line-height:1}
.steps{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; background:var(--surface-2); border-radius:12px; padding:4px; margin:16px 0 4px; position:sticky; top:calc(57px + env(safe-area-inset-top,0px)); z-index:10}
.step{border-radius:9px; padding:8px 2px; font-size:13px; font-weight:600; color:var(--muted); display:flex; flex-direction:column; align-items:center; line-height:1.15}
.step b{font-family:var(--display); font-size:17px; font-weight:800}
.step[aria-current="step"]{background:var(--surface); color:var(--ink)}

/* Presença */
.pres{display:flex; align-items:center; gap:12px; padding:10px 12px; border-top:1px solid var(--line); min-height:58px}
.pres:first-child{border-top:0}
.pres-n{width:22px; text-align:right; font-family:var(--display); font-weight:800; font-size:18px; color:var(--muted)}
.pres-ovr{font-size:17px; color:var(--muted); margin-left:2px}
.toggle{min-width:88px; min-height:44px; border-radius:10px; border:1px solid var(--line-strong); font-weight:600; font-size:14px}
.toggle[aria-pressed="true"]{background:var(--ball); color:var(--ball-ink); border-color:transparent}
.paid{min-height:44px; padding:0 10px; border-radius:10px; font-size:13px; font-weight:600; color:var(--muted); border:1px dashed var(--line-strong)}
.paid[aria-pressed="true"]{color:var(--pos); border:1px solid currentColor}
.wait{font-size:12px; font-weight:600; color:var(--zone)}

/* Times */
.teams{display:grid; gap:12px}
.team{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.team-head{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line)}
.team-dot{width:14px; height:14px; border-radius:4px; flex:none}
.team-name{font-weight:600; flex:1}
.team-avg{font-family:var(--display); font-weight:800; font-size:22px}
.tp{display:flex; align-items:center; gap:10px; padding:8px 14px; width:100%; text-align:left; border-top:1px solid var(--line)}
.team-head + .tp{border-top:0}
.tp[aria-pressed="true"]{background:var(--surface-2); box-shadow:inset 3px 0 0 var(--ball)}
.tp-tag{display:block; font-size:12px; font-weight:600; color:var(--zone)}
.tp-out .tp-name,.tp-out .tp-ovr{opacity:.5}
.join-btn{min-height:38px; padding:0 12px 0 10px; border-radius:10px; border:1px solid var(--line-strong); font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px}
.join-btn::before{content:""; width:10px; height:10px; border-radius:3px; background:var(--tc)}
.tp-pos{font-size:12px; font-weight:600; color:var(--muted); width:30px}
.tp-name{flex:1; font-weight:500}
.tp-ovr{font-family:var(--display); font-weight:800; font-size:20px}
.seg{display:inline-flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:3px}
.seg button{min-width:42px; min-height:34px; border-radius:8px; font-weight:600; font-size:14px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink)}

/* Súmula */
.scout-players{display:grid; grid-template-columns:repeat(auto-fill,minmax(98px,1fr)); gap:8px}
.sp{min-height:48px; border-radius:10px; border:1px solid var(--line-strong); padding:6px 8px; text-align:left; display:flex; flex-direction:column; justify-content:center; position:relative; background:var(--surface)}
.sp::before{content:""; position:absolute; left:0; top:8px; bottom:8px; width:4px; border-radius:0 3px 3px 0; background:var(--tc)}
.sp-name{font-weight:600; font-size:14px; padding-left:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sp-n{font-size:12px; color:var(--muted); padding-left:4px}
.sp[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.sp[aria-pressed="true"] .sp-n{color:inherit; opacity:.75}
.ev-grid{display:grid; gap:10px; margin-top:14px}
.ev-row{display:grid; grid-template-columns:96px 1fr 1fr; gap:8px; align-items:stretch}
.ev-row.one{grid-template-columns:96px 1fr}
.ev-attr{align-self:center; font-weight:600; font-size:14px}
.ev{min-height:58px; border-radius:12px; font-weight:600; font-size:15px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; border:1.5px solid}
.ev.plus{border-color:var(--pos); color:var(--pos)}
.ev.minus{border-color:var(--neg); color:var(--neg)}
.ev b{font-family:var(--display); font-size:24px; font-weight:800}
.ev:active{transform:scale(.97)}
.flash{min-height:22px; font-size:14px; font-weight:600; margin-top:10px}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{padding:8px 10px; text-align:right; white-space:nowrap; border-top:1px solid var(--line)}
thead th{border-top:0; font-size:12px; color:var(--muted); font-weight:600}
th:first-child,td:first-child{text-align:left}
td .num{font-size:18px}
.rk{gap:8px; text-align:left}
.rk-n{width:20px; color:var(--muted); font-size:17px}
.rk-name{display:flex; flex-direction:column; line-height:1.2; max-width:110px}
.rk-name b{font-weight:600; overflow:hidden; text-overflow:ellipsis}
.rk-name span{font-size:12px; color:var(--muted); font-weight:600}
.rank-tbl th,.rank-tbl td{padding:8px 7px}

/* Placar dos sets */
.set{display:grid; grid-template-columns:44px 1fr auto 1fr 36px; gap:8px; align-items:center; padding:10px 12px; border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set-n{font-weight:600; font-size:13px; color:var(--muted)}
.set-side{display:flex; align-items:center; gap:8px; min-width:0}
.set-side.r{flex-direction:row-reverse}
.score{width:56px; height:48px; padding:0; text-align:center; -moz-appearance:textfield; appearance:textfield; border-radius:10px; border:1px solid var(--line-strong); background:var(--bg); font-family:var(--display); font-weight:800; font-size:26px}
.score::-webkit-inner-spin-button,.score::-webkit-outer-spin-button{-webkit-appearance:none; margin:0}
.set-x{color:var(--muted); font-weight:600}
.set select{max-width:100%; min-height:36px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); font-size:13px; padding:0 4px}
.set-multi{grid-template-rows:auto auto; row-gap:10px}
.m-n{grid-column:1; grid-row:1 / span 2; align-self:center}
.m-a{grid-column:2; grid-row:1; width:100%}
.m-x{grid-column:3; grid-row:1 / span 2; align-self:center}
.m-b{grid-column:4; grid-row:1; width:100%}
.m-del{grid-column:5; grid-row:1 / span 2; align-self:center}
.m-pa{grid-column:2; grid-row:2}
.m-pb{grid-column:4; grid-row:2; justify-content:flex-end}
.del{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:var(--muted)}
.del svg{width:16px; height:16px}
.total{font-family:var(--display); font-weight:800; font-size:30px; text-align:center; margin:14px 0 4px}

/* Cartas */
.cards{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
@media (min-width:520px){.cards{grid-template-columns:repeat(3,1fr)}}
.card-btn{display:block; width:100%; text-align:left}
.card{--c-bg:#CBD3DD; --c-ink:#1E2A3A; --c-sub:#445468; --c-net:rgba(30,42,58,.25); --c-frame:rgba(30,42,58,.35);
  position:relative; container-type:inline-size; aspect-ratio:5/7; width:100%; background:var(--c-bg); color:var(--c-ink); border-radius:12px; overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%); display:flex; flex-direction:column; padding:9% 9% 7%}
.card::before{content:""; position:absolute; left:0; right:0; top:0; height:56%; pointer-events:none;
  background-image:repeating-linear-gradient(45deg,var(--c-net) 0 1px,transparent 1px 10px),repeating-linear-gradient(-45deg,var(--c-net) 0 1px,transparent 1px 10px);
  -webkit-mask-image:linear-gradient(#000 20%,transparent); mask-image:linear-gradient(#000 20%,transparent); opacity:.75}
.card::after{content:""; position:absolute; inset:5px; border:1px solid var(--c-frame); border-radius:8px; pointer-events:none;
  clip-path:polygon(0 0,calc(100% - 15px) 0,100% 15px,100% 100%,0 100%)}
.card > *{position:relative}
.card-top{display:flex; justify-content:space-between; align-items:flex-start; flex:1}
.card-ovr{display:flex; flex-direction:column; line-height:1}
.card-ovr b{font-family:var(--display); font-weight:900; font-size:42px; font-size:30cqw; line-height:.82}
.card-ovr small{font-weight:600; font-size:12px; font-size:8.5cqw; color:var(--c-sub); margin-top:3px}
.trend{font-size:11px; font-size:7.5cqw; font-weight:600; margin-top:3px}
.card-photo{width:52%; aspect-ratio:1; border-radius:50%; overflow:hidden; display:grid; place-items:center; background:var(--c-frame); border:2px solid var(--c-sub); margin-top:4%}
.card-photo img{width:100%; height:100%; object-fit:cover}
.card-zoom{padding:0; cursor:zoom-in}
.tour{position:fixed; inset:0; z-index:90; background:var(--bg); display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top,0px) + 10px) 0 calc(env(safe-area-inset-bottom,0px) + 16px)}
.tour::after{content:""; position:absolute; left:0; right:0; top:100%; height:160px; background:var(--bg); pointer-events:none}
.tour-top{display:flex; align-items:center; justify-content:space-between; padding:0 16px; min-height:44px}
.tour-step{font-size:13px; font-weight:600; color:var(--muted)}
.tour-skip{font-weight:600; font-size:15px; color:var(--muted); padding:10px 4px}
.tour-slides{flex:1; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; overscroll-behavior-x:contain}
.tour-slides::-webkit-scrollbar{display:none}
.tour-slide{flex:0 0 100%; width:100%; scroll-snap-align:center; scroll-snap-stop:always; display:flex; flex-direction:column; justify-content:center; padding:0 24px}
.tour-inner{width:100%; max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
.tour-art{display:flex; justify-content:center; align-items:center; min-height:230px}
.tour-title{font-family:var(--display); font-weight:800; font-size:36px; line-height:1.02}
.tour-text{color:var(--muted); font-size:17px; line-height:1.5; margin:0}
.tour-dots{display:flex; gap:8px; justify-content:center; margin:14px 0 18px}
.tour-dots i{width:8px; height:8px; border-radius:4px; background:var(--line-strong); transition:width .2s,background .2s}
.tour-dots i.on{width:26px; background:var(--ball)}
.tour-bottom{padding:0 16px; max-width:560px; width:100%; margin:0 auto}
.tour-board{width:100%; max-width:300px; margin:0}
.tour-score{display:grid; gap:8px; width:100%; max-width:300px}
.tour-set{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px}
.tour-set b{font-family:var(--display); font-weight:800; font-size:24px}
.tour-up{display:flex; align-items:center; gap:10px; justify-content:center; font-weight:600}
.tour-up .delta{font-size:20px}
@media (prefers-reduced-motion:reduce){.tour-dots i{transition:none}}
.icon-btn.bell{position:relative}
.badge{position:absolute; top:-4px; right:-4px; min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:var(--ball); color:var(--ball-ink); font-size:11px; font-weight:800; display:grid; place-items:center; line-height:1}
.sug-row{display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding:2px 2px 8px; margin:0 -2px; scrollbar-width:none}
.sug-row::-webkit-scrollbar{display:none}
.sug{position:relative; flex:0 0 150px; scroll-snap-align:start; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 10px 12px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center}
.sug-av .av{width:64px; height:64px; font-size:22px}
.sug-av{padding:0; border-radius:50%}
.sug-name{font-weight:700; font-size:15px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sug-why{font-size:12px; color:var(--muted); min-height:30px; line-height:1.25}
.sug-x{position:absolute; top:6px; right:6px; width:28px; height:28px; display:grid; place-items:center; color:var(--muted); border-radius:50%}
.sug-x svg{width:14px; height:14px}
.card-cell{display:flex; flex-direction:column; gap:6px; min-width:0}
.card-stack{position:relative; container-type:inline-size}
.card-add{position:absolute; left:9cqw; right:9cqw; bottom:3cqw; height:10.5cqw; min-height:26px; border-radius:2.6cqw; background:var(--ball); color:var(--ball-ink); font-weight:800; font-size:max(11px, 6.2cqw); display:flex; align-items:center; justify-content:center; gap:1.5cqw; box-shadow:0 1px 0 rgba(0,0,0,.25); z-index:2; white-space:nowrap}
.card-add svg{width:max(12px, 6cqw); height:max(12px, 6cqw)}
.card-add.sent{background:rgba(30,42,58,.10); color:#1E2A3A; box-shadow:inset 0 0 0 1px rgba(30,42,58,.4)}
.chip-sep{flex:0 0 1px; width:1px; height:26px; background:var(--line-strong); margin:0 2px}
.action-list{background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden}
.action-row{display:flex; align-items:center; gap:12px; min-height:56px; padding:0 16px; font-size:17px; font-weight:500; color:var(--ink); text-decoration:none}
.action-row + .action-row{border-top:1px solid var(--line)}
.action-row svg{width:20px; height:20px; color:var(--muted)}
.action-row:active{background:var(--line)}
.stars{display:flex; gap:4px; flex:none}
.star{width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:14px}
.star[aria-pressed="true"]{background:var(--ball); color:var(--ball-ink); border-color:var(--ball)}
.rate-row .item-main{min-width:0}
.role-pill{display:inline-block; padding:3px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-size:12px; font-weight:600}
.link-btn.quiet{color:var(--muted); font-weight:600; font-size:14px}
.pay-card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin:14px 0; display:flex; flex-direction:column; gap:10px; box-shadow:0 0 0 2px var(--ball)}
.pay-k{font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
.pay-v{font-family:var(--display); font-weight:800; font-size:40px; line-height:1}
.pay-sum{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; margin-top:12px}
.pay-big{font-family:var(--display); font-weight:800; font-size:28px; line-height:1}
.pay-bar{height:6px; border-radius:6px; background:var(--line); overflow:hidden}
.pay-bar i{display:block; height:100%; background:var(--ink)}
.pay-sec{font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 2px 6px}
.pst{border-radius:999px; padding:0 10px; min-height:32px; font-weight:600; font-size:12.5px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; border:0; flex:none}
.pst-ok{background:#E2F1E7; color:#1B5A34}
.pst-due{background:#FBE6E2; color:#8F2414}
.pst-warn{background:var(--ball); color:var(--ball-ink)}
.pst-mute{background:var(--line); color:var(--muted)}
.pst-dash{background:var(--surface); border:1px dashed var(--line-strong); color:var(--ink)}
.ptag{border:1px solid var(--line); border-radius:999px; padding:3px 9px; font-weight:600; font-size:12px; color:var(--muted); white-space:nowrap}
.ab-card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:10px; text-align:left; color:var(--ink); width:100%; box-sizing:border-box}
.ab-btn{font:inherit}
.ab-list{display:grid; gap:10px}
.ab-when{font-family:var(--display); font-weight:800; font-size:22px; line-height:1}
.ab-strip{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x mandatory}
.ab-mini{min-width:220px; scroll-snap-align:start; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:6px; text-align:left; color:var(--ink); font:inherit}
.ab-badge{display:inline-flex; min-width:20px; height:20px; border-radius:10px; background:var(--ball); color:var(--ball-ink); font-size:12px; font-weight:700; align-items:center; justify-content:center; margin-left:6px; padding:0 6px}
.nt-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px}
.nt-n{min-height:50px; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-family:var(--display); font-weight:800; font-size:22px}
.nt-n[aria-pressed="true"]{background:var(--ball); border-color:var(--ball); color:var(--ball-ink)}
.nt-nv{font-family:inherit; font-size:13px; font-weight:700}
.nt-av > *{transform:scale(1.9); margin:18px auto 22px}
.nt-ball{width:64px; height:64px; border-radius:50%; background:var(--ball); color:var(--ball-ink); display:flex; align-items:center; justify-content:center; margin:0 auto}
.nt-ball svg{width:32px; height:32px}
.nt-live{background:#0F2240; color:#fff; border-radius:20px; padding:16px; display:flex; flex-direction:column; gap:6px; margin-top:14px}
.nt-k{font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#F7C531}
.nt-name{font-family:var(--display); font-weight:800; font-size:28px; line-height:1}
.nt-sub{font-size:13px; color:#C9D5E6}
.nt-mvp{background:#0F2240; color:#fff; border-radius:20px; padding:14px 16px; display:flex; align-items:center; gap:14px; box-shadow:0 0 0 3px #F7C531; margin-bottom:12px}
.nt-nota{font-family:var(--display); font-weight:800; font-size:22px; min-width:44px; text-align:right}
.nt-d{font-weight:700; font-size:13px}
.nt-d.up{color:#1B7A45}
.nt-d.down{color:#B4321F}
.nt-tp{display:flex; align-items:center}
.nt-tp .tp{flex:1}
.nt-pool{border-style:dashed}
.stb{width:42px; height:42px; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-size:20px; font-weight:700}
.save-chip{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:0 10px; min-height:28px; font-size:12.5px; font-weight:700; background:var(--line); color:var(--muted); border:0; flex:none}
.save-chip.ok{background:#E2F1E7; color:#1B5A34}
.save-chip.err{background:#FBE6E2; color:#8F2414}
.link-btn{padding:0; color:var(--ink); font-weight:700; text-decoration:underline; text-underline-offset:2px; font-size:inherit}
.turma-switch{display:inline-flex; align-items:center; gap:6px; padding:0; color:var(--ink)}
.turma-switch svg{width:22px; height:22px; margin-top:2px}
.search-box{position:relative; margin:14px 0 6px}
.search-box .input{padding-left:42px}
.search-ico{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); display:grid; pointer-events:none}
.search-ico svg{width:18px; height:18px}
#peopleRes .list{margin-bottom:6px}
.chips-line{display:flex; gap:8px; align-items:center; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin:0 0 12px; padding-bottom:2px}
.chips-line::-webkit-scrollbar{display:none}
.chips-line .chip{flex:0 0 auto; padding:7px 13px; font-size:14px}
.card-meta{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center}
.zoom-bg{position:fixed; inset:0; z-index:80; background:rgba(4,12,26,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:calc(env(safe-area-inset-top,0px) + 56px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.zoom-bg img{max-width:100%; max-height:72vh; border-radius:18px; object-fit:contain; box-shadow:0 0 0 3px var(--ball)}
.zoom-cap{color:#F3F6FB; font-family:var(--display); font-weight:800; font-size:30px; margin-top:14px}
.zoom-close{position:absolute; top:calc(env(safe-area-inset-top,0px) + 12px); right:16px; color:#F3F6FB; border-color:rgba(255,255,255,.3)}
.card-photo span{font-family:var(--display); font-weight:800; font-size:24px; font-size:17cqw}
.card-name{font-weight:600; font-size:15px; font-size:10.5cqw; text-align:center; padding:4% 0 3%; border-bottom:1px solid var(--c-frame); margin-bottom:5%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card-attrs{display:grid; grid-template-columns:1fr 1fr; column-gap:10%}
.card-attrs div{display:flex; align-items:baseline; gap:6%; line-height:1.15}
.card-attrs b{font-family:var(--display); font-weight:800; font-size:18px; font-size:12.5cqw; min-width:2ch}
.card-attrs span{font-weight:600; font-size:11px; font-size:7.5cqw; color:var(--c-sub); letter-spacing:.04em}
.card-tier{font-size:10px; font-size:7cqw; font-weight:600; color:var(--c-sub); text-align:center; margin-top:4%}
.t-bronze{--c-bg:#C98552; --c-ink:#3A1F0B; --c-sub:#5C3417; --c-net:rgba(58,31,11,.28); --c-frame:rgba(58,31,11,.35)}
.t-prata{--c-bg:#CBD3DD; --c-ink:#1E2A3A; --c-sub:#445468; --c-net:rgba(30,42,58,.22); --c-frame:rgba(30,42,58,.32)}
.t-ouro{--c-bg:#F4CD55; --c-ink:#3B2A00; --c-sub:#6B4F00; --c-net:rgba(59,42,0,.24); --c-frame:rgba(59,42,0,.35)}
.t-elite{--c-bg:#2D5BD8; --c-ink:#FFFFFF; --c-sub:#D3E2FF; --c-net:rgba(255,255,255,.22); --c-frame:rgba(255,255,255,.4)}
.t-lenda{--c-bg:#101B33; --c-ink:#F7C531; --c-sub:#D9B54A; --c-net:rgba(247,197,49,.22); --c-frame:rgba(247,197,49,.55)}
.t-destaque{--c-bg:#F06B2E; --c-ink:#2B0D00; --c-sub:#5E2108; --c-net:rgba(43,13,0,.26); --c-frame:rgba(43,13,0,.4)}
.card-lg{max-width:230px; margin:0 auto}
.card-md{max-width:180px}

/* Folha (sheet) */
.sheet-bg{position:fixed; inset:0; z-index:50; background:rgba(4,12,26,.55); display:flex; align-items:flex-end; justify-content:center}
.sheet{box-shadow:0 240px 0 0 var(--bg); overflow-x:hidden; width:100%; max-width:560px; max-height:calc(100% - 24px - env(safe-area-inset-top,0px)); overflow-y:auto; background:var(--bg); border-radius:20px 20px 0 0; padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-grab{width:40px; height:5px; border-radius:3px; background:var(--line-strong); margin:4px auto 10px}
.sheet-head{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.sheet-title{font-family:var(--display); font-weight:800; font-size:28px; line-height:1.05; flex:1}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:rise .22s ease-out} @keyframes rise{from{transform:translateY(24px); opacity:.6}} }

/* Formulários */
.field{display:block; margin-bottom:14px}
.field > span{display:block; font-size:14px; font-weight:600; margin-bottom:6px}
.input{width:100%; min-height:48px; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); padding:0 14px; font-size:16px}
textarea.input{padding:12px 14px; min-height:80px}
input[type=date].input,input[type=time].input{-webkit-appearance:none; appearance:none; display:block; min-width:0; max-width:100%; height:48px; text-align:left}
input[type=date].input::-webkit-date-and-time-value,input[type=time].input::-webkit-date-and-time-value{text-align:left; margin:0}
input[type=date].input::-webkit-datetime-edit,input[type=time].input::-webkit-datetime-edit{padding:0}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px}
.field,.grid2 > *,.set > *{min-width:0}
.rate-block{margin-bottom:6px}
.live{position:sticky; top:0; z-index:3; background:var(--bg); display:flex; align-items:center; gap:10px; padding:10px 0 8px; margin-bottom:2px; border-bottom:1px solid var(--line)}
.live-label{flex:1; font-size:14px; font-weight:600}
.live-ovr{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap}
.live-ovr b{font-family:var(--display); font-weight:800; font-size:26px; line-height:1; color:var(--ink)}
.live-sw{width:14px; height:14px; border-radius:4px; background:var(--c-bg); border:1px solid var(--c-frame)}
.rng-row{padding:8px 0 2px}
.rng-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.rng-name{font-weight:600; font-size:15px}
.rng-val{font-family:var(--display); font-weight:800; font-size:24px; line-height:1; white-space:nowrap}
.rng-val small{font-family:var(--text); font-weight:600; font-size:13px; color:var(--muted); margin-right:6px}
.rng-line{display:flex; align-items:center; gap:12px}
.rng-num{width:3.2ch; font-family:var(--display); font-weight:800; font-size:26px; line-height:1.05; text-align:right; color:var(--ink); background:transparent; border:0; border-bottom:2px dashed var(--line-strong); border-radius:0; padding:0 2px 1px; -webkit-appearance:none; appearance:none}
.rng-num:focus{outline:none; border-bottom-color:var(--focus); border-bottom-style:solid; background:var(--surface)}
.rng-num::placeholder{color:var(--muted); opacity:.6}
.rng-num.bad{color:var(--neg); border-bottom-color:var(--neg); border-bottom-style:solid}
.rng-err{color:var(--neg); font-size:13px; font-weight:600; margin-top:2px}
.rng-err:empty{display:none}
.seg-full{display:grid; grid-template-columns:repeat(3,1fr); width:100%}
.seg-full button{min-height:42px}
.rng{position:relative; flex:1; min-width:0; touch-action:pan-y; cursor:pointer; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; border-radius:10px}
.bar{height:52px}
.rng-track{position:absolute; left:16px; right:16px; top:50%; height:10px; margin-top:-5px; border-radius:5px; background:var(--star-off)}
.rng-fill{position:absolute; left:0; top:0; bottom:0; width:calc(var(--p) * 100%); border-radius:5px; background:var(--star-on)}
.rng-thumb{position:absolute; top:50%; left:calc(16px + var(--p) * (100% - 32px)); width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; background:#fff; box-shadow:0 0 0 1px rgba(15,34,64,.14),0 2px 6px rgba(4,12,26,.22); transition:box-shadow .12s}
.bar.dragging .rng-thumb{box-shadow:0 0 0 6px color-mix(in srgb,var(--star-on) 30%,transparent),0 2px 6px rgba(4,12,26,.22)}
.rng-bubble{position:absolute; left:50%; bottom:calc(100% + 10px); transform:translateX(-50%) scale(.7); opacity:0; background:var(--ink); color:var(--bg); font-family:var(--display); font-weight:800; font-size:20px; line-height:1; padding:5px 9px; border-radius:8px; pointer-events:none; transition:opacity .12s,transform .12s}
.bar.dragging .rng-bubble{opacity:1; transform:translateX(-50%) scale(1)}
.bar.snap .rng-fill{transition:width .16s ease-out}
.bar.snap .rng-thumb{transition:left .16s ease-out}
@media (prefers-reduced-motion:reduce){.bar.snap .rng-fill,.bar.snap .rng-thumb,.rng-bubble,.rng-thumb{transition:none}}
.nudge{flex:none; width:42px; height:42px; border-radius:50%; border:1px solid var(--line-strong); background:var(--surface); font-size:22px; font-weight:600; line-height:1; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.pos-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.pos-grid button{min-height:44px; border-radius:10px; border:1px solid var(--line-strong); font-weight:600; font-size:14px}
.pos-grid button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.err{color:var(--neg); font-size:13px; font-weight:600; margin-top:6px}

/* Relatório */
.rep{display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid var(--line); width:100%; text-align:left}
.rep:first-child{border-top:0}
.nota{min-width:44px; text-align:center; font-family:var(--display); font-weight:800; font-size:20px; padding:2px 6px; border-radius:8px; background:var(--surface-2)}
.nota.hi{background:var(--ball); color:var(--ball-ink)}
.delta{font-weight:600; font-size:14px; min-width:36px; text-align:right}
.delta.up{color:var(--pos)} .delta.down{color:var(--neg)} .delta.eq{color:var(--muted)}
.rep-detail{padding:4px 14px 12px 66px; font-size:14px; color:var(--muted); border-top:0}
.rep-detail div{margin-top:3px}
.awards{display:grid; gap:8px}
.award{display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:12px}
.award b{font-weight:600}
.mvp{display:grid; grid-template-columns:140px 1fr; gap:16px; align-items:center}

/* Estatísticas do jogador */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px}
.stat b{display:block; font-family:var(--display); font-weight:800; font-size:26px; line-height:1}
.stat span{font-size:12px; color:var(--muted); font-weight:600}
.spark{width:100%; height:auto; display:block}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:14px; font-weight:600; max-width:calc(100% - 32px); text-align:center}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.help h3{font-family:var(--display); font-weight:800; font-size:22px; margin:18px 0 6px}
.help p{color:var(--ink)}
.tiers{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:8px 0}
.tiers div{border-radius:8px; padding:8px 4px; text-align:center; font-size:12px; font-weight:600; background:var(--c-bg); color:var(--c-ink)}
.loading{padding:60px 0; text-align:center; color:var(--muted)}

/* ================= Polimento v1: base visual =================
   Menos linha, mais profundidade: superfícies sem borda com sombra suave, cantos maiores,
   botões tonais, filtros em pílula, barra de baixo flutuante e cartas com metal. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#E9EDF3; --line:rgba(15,34,64,.08); --line-strong:rgba(15,34,64,.18);
  --sh-1:0 1px 2px rgba(15,34,64,.05),0 6px 20px rgba(15,34,64,.06);
  --sh-2:0 2px 6px rgba(15,34,64,.06),0 16px 36px rgba(15,34,64,.12);
  --r-card:22px; --r-btn:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0B1D38; --surface:#132C52; --surface-2:#1B3962; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.2);
    --sh-1:inset 0 1px 0 rgba(255,255,255,.04),0 8px 22px rgba(0,0,0,.28); --sh-2:inset 0 1px 0 rgba(255,255,255,.05),0 16px 36px rgba(0,0,0,.4); }
}
:root[data-theme="dark"]{ --bg:#0B1D38; --surface:#132C52; --surface-2:#1B3962; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.2);
  --sh-1:inset 0 1px 0 rgba(255,255,255,.04),0 8px 22px rgba(0,0,0,.28); --sh-2:inset 0 1px 0 rgba(255,255,255,.05),0 16px 36px rgba(0,0,0,.4); }

/* Topo: sem linha, com vidro */

const ATTRS = ['saq', 'rec', 'lev', 'ata', 'blo', 'def'];

const POS = {

  pon: { abbr: 'PON', name: 'Ponteiro', w: { ata: .30, rec: .25, def: .15, saq: .15, blo: .10, lev: .05 } },

  opo: { abbr: 'OPO', name: 'Oposto', w: { ata: .40, blo: .20, saq: .20, def: .10, rec: .05, lev: .05 } },
  lib: { abbr: 'LÍB', name: 'Líbero', w: { rec: .40, def: .40, lev: .10, saq: .10, ata: 0, blo: 0 } },

  bl: { attr: 'blo', sign: 1, label: 'Ponto de bloqueio', short: 'Ponto de bloqueio' },

const EVENT_KEYS = Object.keys(EVENTS);
const EXPECT = { saq: [-1.5, 1.0], rec: [-2.0, -0.2], lev: [-1.5, -0.1], ata: [-1.0, 2.0], blo: [0.0, 0.8], def: [0.3, 2.5] };

  { key: 'elite', name: 'Elite', min: 85 },

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const r1 = v => Math.round(v * 10) / 10;
const starsToAttr = s => clamp(42 + (s - 1) * 12, 40, 99);

function tecnica(p) {
  const w = (POS[p.pos] || POS.cor).w;
  let t = 0;
  for (const a of ATTRS) t += (w[a] || 0) * (p.at?.[a] ?? 60);

function ovrOf(p) { return Math.round(ovrRaw(p)); }
function tierOf(ovr) {
  let t = TIERS[0];

  const [lo, hi] = EXPECT[attr];

function setFormaDelta(rTeam, rOpp, won, margin) {
  const E = 1 / (1 + Math.pow(10, (rOpp - rTeam) / 20));

// Calcula o resultado de um jogo sem gravar nada.
function computeResult(game, playersById, opts = {}) {
  const calib = opts.calib || {};
  const teams = game.teams || [];
  const teamOf = {};
  teams.forEach((t, i) => t.forEach(pid => { if (playersById[pid]) teamOf[pid] = i; }));
  const members = Object.keys(teamOf);
  const pre = {};
  for (const pid of members) pre[pid] = ovrOf(playersById[pid]);
  const teamR = teams.map(t => {
    const v = t.filter(pid => pre[pid] != null).map(pid => pre[pid]);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 60;

  const join = game.join || {}, leave = game.leave || {};
  const active = (pid, i) => i >= (join[pid] || 0) && i < (leave[pid] == null ? Infinity : leave[pid]);
  const sp = {}, sw = {}, formaD = {};

    if (!s || s.pa == null || s.pb == null || s.pa === '' || s.pb === '') return;

function suggestions() {

  const add = (id, kind, v) => {
    if (id === me || hidden[id] || !canFriend(id) || friendState(id) !== 'none') return;
    const c = cand.get(id) || { id, games: 0, via: [] };
    if (kind === 'g') c.games += 1; else if (!c.via.includes(v)) c.via.push(v);
    cand.set(id, c);

}

// ---------- Jogo ----------
function cleanContest(c) {
  if (!c || typeof c !== 'object' || !['aberto', 'mantido'].includes(c.st)) return null;
  return { st: c.st, rev: Math.max(0, Math.round(Number(c.rev) || 0)), at: Number(c.at) || 0, n: Math.max(0, Math.round(Number(c.n) || 0)), by: typeof c.by === 'string' ? c.by : '' };
}
const contestFim = g => (g.finishedAt || startTs(g) + 3 * 3600e3) + 24 * 3600e3;
const contestDoc = (g, u) => S.contests[`ct_${g.id}_${u}`];
const meuContest = g => { const c = contestDoc(g, meId()); return c && c.rev === (g.resultRev || 0) ? c : null; };
function podeContestar(g) { return FBM() && hasResult(g) && teamIds(g).includes(meId()) && !canEditGame(g) && Date.now() < contestFim(g) && !meuContest(g) && !(g.contest && g.contest.st === 'mantido' && g.contest.rev === (g.resultRev || 0)); }
function contestsDe(g) { return Object.values(S.contests).filter(c => c.gid === g.id && c.rev === (g.resultRev || 0)); }
function contestLinkHTML(g) {
  if (!FBM() || !hasResult(g)) return '';
  if (meuContest(g)) return `<p class="sub small" style="margin-top:10px">Você contestou este placar. Os admins vão revisar.</p>`;
  if (podeContestar(g)) return `<p style="margin-top:10px"><button class="link-btn quiet" data-act="contestar" data-id="${esc(g.id)}">Placar errado? Contestar</button></p>`;
  return '';
}
// O app de um admin marca o jogo como contestado quando chega uma contestação do placar atual.
const CT_RUN = new Set();
function ensureContests() {
  if (!FBM() || !isTurmaAdmin() || !S.firmData) return;
  for (const g of Object.values(S.games)) {
    const cs = contestsDe(g); if (!cs.length) continue;
    const rev = g.resultRev || 0;
    if (g.contest && g.contest.rev === rev) continue;
    const key = g.id + ':' + rev; if (CT_RUN.has(key)) continue; CT_RUN.add(key);
    g.contest = { st: 'aberto', rev, at: Date.now(), n: cs.length, by: '' }; persist('games', g.id); dirty(); render();
  }
}
function confirmBox(g) {
  if (FB() && hasResult(g) && contestado(g)) {
    if (canEditGame(g)) {
      const cs = contestsDe(g);
      return `<div class="banner" style="flex-direction:column;align-items:stretch;gap:10px"><b>Placar contestado</b>${cs.map(c => `<span class="sub small">${esc(nameOf(c.createdBy))}: ${esc(c.motivo || 'sem motivo escrito')}</span>`).join('') || '<span class="sub small">Alguém que jogou contestou.</span>'}<span class="sub small">Até você revisar, a partida não conta nas cartas.</span><div class="row" style="gap:8px"><button class="btn btn-sm" style="flex:1" data-act="contestManter" data-id="${esc(g.id)}">Manter o placar</button><button class="btn btn-sm btn-ball" style="flex:1" data-act="corrigirFinal">Corrigir</button></div></div>`;
    }
    return `<div class="banner">Placar contestado. Até um admin revisar, a partida não conta nas cartas.</div>`;
  }
  if (FB() && hasResult(g) && needsConfirm(g) && accountIds(g).length < 4) return `<div class="banner">Esta partida não entra nas cartas: precisa de pelo menos 4 jogadores com conta nos times.</div>`;
  return '';
}
function confirmBoxAntigo(g) {

  if (gameCounts(g)) { const who = confirmers(g).map(nameOf).join(', '); return `<div class="banner">Placar confirmado por ${esc(who)}. Os pontos já estão nas cartas.</div>`; }

  return `<div class="banner" style="border:1px solid var(--zone);background:transparent">Os pontos entram nas cartas quando alguém de outro time confirmar o placar.</div>`;
}
function saveChip(g) {

function gameHead(g) {

function gameView(g) {
  const step = S.ui.step || (FBM() ? (g.teams && g.teams.filter(t => t.length).length >= 2 ? (Date.now() >= startTs(g) ? 'jogo' : 'times') : 'presenca') : (g.teams ? (g.log.length || g.sets.length ? 'sumula' : 'times') : 'presenca'));
  S.ui.step = step;
  const conf = g.conf.filter(P).length;
  const st = (k, n, l) => `<button class="step" data-act="step" data-step="${k}" ${step === k ? 'aria-current="step"' : ''}><b>${n}</b>${l}</button>`;
  let h = gameHead(g) + confirmBox(g);
  if (FBM() && g.status === 'encerrado') h += `<div class="banner" style="background:transparent;border:1px solid var(--line-strong)"><span class="spacer">Corrigindo um jogo encerrado. As cartas e o ranking se ajustam sozinhos.</span><button class="btn btn-sm btn-ball" data-act="verResultado">Ver resultado</button></div>`;
  if (FBM()) h += `<nav class="steps" aria-label="Etapas do jogo">${st('presenca', 1, 'Presença')}${st('times', 2, 'Times')}${st('jogo', 3, 'Jogo')}${st('notas', 4, 'Notas')}</nav>`;
  else h += `<nav class="steps" aria-label="Etapas do jogo">${st('presenca', 1, 'Presença')}${st('times', 2, 'Times')}${st('sumula', 3, 'Súmula')}${st('placar', 4, 'Placar')}</nav>`;
  if (step === 'presenca') h += presencaStep(g, conf);
  else if (step === 'times') h += FBM() ? timesStep2(g) : timesStep(g);
  else if (step === 'jogo') h += jogoStep(g);

  else h += placarStep(g);

}
function presencaStep(g, confN) {

function helpHTML() {
  const tiers = TIERS.map((t, i) => `<div class="t-${t.key}">${t.name}<br>${t.min || 'até 64'}${i < TIERS.length - 1 ? (t.min ? '–' + (TIERS[i + 1].min - 1) : '') : '+'}</div>`).join('');
  return `<div class="help">
  ${FB() && P(meId()) ? '<button class="btn btn-block" data-act="tourAgain" style="margin-bottom:14px">Ver o tutorial de novo</button>' : ''}
  <p>Cada jogador tem uma carta. O número grande é o geral, que junta a técnica (70%) e a forma (30%).</p>
  <h3>Técnica</h3><p>São os seis fundamentos: saque, recepção, levantamento, ataque, bloqueio e defesa. Cada posição pesa os fundamentos de um jeito. No levantador, o levantamento vale 45% da técnica. No central, o bloqueio vale 35%.</p>
  <p>No cadastro você escolhe o nível de entrada, iniciante, experiente ou avançado, e as notas já vêm de acordo com a posição. Depois é só ajustar cada fundamento de 40 a 90, arrastando ou digitando. Passar de 90 e chegar a Lenda só jogando.</p>
  <h3>Calibração</h3><p>O nível de entrada é um chute, então nos 5 primeiros jogos a carta anda mais rápido: no primeiro, o dobro do normal. Depois disso ela firma. Enquanto isso a carta mostra "em calibração".</p>
  <h3>Como a súmula mexe na carta</h3><p>No jogo você escolhe o que vai anotar e toca no jogador e no lance. No fim, o app calcula o saldo de cada um por set e compara com o esperado para o nível da carta. Quem foi melhor que o esperado sobe, quem foi pior desce. Por isso um 90 que erra um saque por set desce, e um 60 que erra o mesmo tanto mexe pouco.</p>
  <p>Só os fundamentos anotados naquele jogo mudam. Um fundamento mexe no máximo 4 pontos por jogo, e fica mais difícil subir perto do 99.</p>
  <h3>Forma</h3><p>Vem do placar dos sets. Ganhar de um time mais forte rende mais do que ganhar de um mais fraco, e lavada conta um pouco mais que set apertado. O que um time ganha, o outro perde, então a média da galera não infla.</p>
  <h3>Cores</h3><div class="tiers">${tiers}</div><p>A carta laranja é o destaque: o MVP do último jogo fica com ela até o próximo.</p>
  <h3>Sorteio</h3><p>Com até 16 jogadores em 2 times, o app testa todas as divisões e escolhe uma das mais equilibradas pela média do geral. Com mais times, ele monta em cobrinha e testa trocas. Também evita juntar os levantadores e os centrais no mesmo time, e quem também joga em outra posição ajuda a cobrir o time que ficou sem levantador.</p>
  <h3>No dia do jogo</h3><p>Se a galera montou a lista no WhatsApp, use colar lista do grupo na presença: o app marca quem achar, na ordem da lista. Quem chega depois do primeiro set entra num time pela tela de times e só conta dali para frente. Se alguém for embora, toque no nome dele.</p>
  <h3>Placar</h3><p>Os pontos entram nas cartas assim que o placar é anotado. As cartas são recalculadas a partir dos jogos, então corrigir um número, até de um jogo antigo, ajusta tudo sozinho. Apagar um jogo tira o efeito dele. Encerrar só trava o jogo para ninguém mexer sem querer.</p>
  <h3>Erro de lançamento</h3><p>Errou um lance? Use desfazer na súmula. Errou o placar? Corrija o número. Se o jogo estiver encerrado, toque em reabrir para corrigir.</p>
  <h3>Seus dados</h3><p>${FBM() ? 'Os dados ficam na nuvem da turma, e cada um entra com a própria conta.' : S.mode === 'cloud' ? 'Os dados ficam na sua conta do Claude.' : 'Os dados ficam salvos só neste celular. Se apagar o app da Tela de Início, eles somem junto.'}${FBM() ? '' : ` O backup gera um arquivo com tudo, cartas, fotos e jogos, que você pode guardar no Arquivos ou mandar para você mesmo no WhatsApp.${lastBackup() ? ` Último backup: ${fmtDay(lastBackup()).toLowerCase()}.` : ''}`}</p>
  ${S.canWrite && !FBM() ? `<div style="display:grid;gap:10px"><button class="btn btn-block btn-ball" data-act="backup">Salvar backup</button><button class="btn btn-block" data-act="restore">Restaurar um backup</button></div>` : ''}
  </div>`;
}

async function createElsewhere(el, where) {
  const date = $('#fDate').value, time = $('#fTime').value || '20:00';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { $('#fErr').textContent = 'Escolha o dia do jogo.'; return; }
  const max = clamp(parseInt($('#fMax').value, 10) || 0, 0, 60), place = $('#fPlace').value.trim().slice(0, 80), note = $('#fNote').value.trim().slice(0, 300);
  let vis = lerVis().vis || 'amigos';
  if (!where.length && vis === 'turma') vis = 'amigos';
  el.disabled = true;
  try {
    if (where.length === 1) {

      const rep = !!document.querySelector('[data-act="gRepeat"][aria-pressed="true"]'), gid = uid('g');
      const t = where[0], g = cleanGame(gid, { date, time, max, place, note, vis, allowed: vis === 'privada' ? [meId()] : [], created: Date.now(), createdBy: meId(), track: ['saq', 'rec'], nTeams: 2, repeat: rep, serie: rep ? gid : '', seq: rep ? 1 : 0 });
      const data = clone(g); delete data.conf; delete data.confirms; delete data.votes; delete data.rates;
      await window.MCloud.db(t).doc('games/' + g.id).set(data);
      closeSheet(); toast(`Jogo marcado na turma ${(S.myTurmas || []).find(x => x.id === t)?.name || ''}.`);
      return;
    }
    const names = {}; for (const t of where) names[t] = ((S.myTurmas || []).find(x => x.id === t) || {}).name || 'Turma';
    let aud = new Set([meId()]);
    if (vis === 'turma' || (vis === 'amigos' && where.length)) {
      const members = new Set();
      for (const t of where) for (const u of await window.MCloud.listMembers(t)) members.add(u);
      if (vis === 'turma') members.forEach(u => aud.add(u)); else for (const f of friendIds()) if (members.has(f)) aud.add(f);
    } else if (vis === 'amigos') for (const f of friendIds()) aud.add(f);
    const id = uid('p');
    const data = { turmas: where, turmaNames: names, vis, allowed: vis === 'privada' ? [meId()] : [], visibleTo: [...aud], createdBy: meId(), date, time, max, place, note, status: 'agendado', conf: [], teams: null, sets: [], votes: {}, roster: {}, created: Date.now() };

function getGeo() {
  return new Promise((ok, no) => {
    if (!navigator.geolocation) return no(new Error('sem'));
    navigator.geolocation.getCurrentPosition(p => ok({ lat: p.coords.latitude, lng: p.coords.longitude }), e => no(e), { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 });

// ================= Pagamentos =================
// A configuração fica na turma: os admins gravam e a turma toda lê (valores e chave Pix, que é preciso para pagar).
// A situação de cada pessoa fica numa ficha privada (coleção partidas, kind 'pago') que só ela e os admins leem.
// O dinheiro nunca passa pelo app: o código Pix é gerado aqui, com o valor certo, e cai direto na conta de quem recebe.
const MESES_LONGOS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const ymOf = d => String(d || '').slice(0, 7);
const ymNow = () => ymOf(todayStr());
const mesNome = ym => MESES_LONGOS[Number(String(ym).slice(5, 7)) - 1] || '';
const ymAdd = (ym, n) => { let y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return `${y}-${pad(m + 1)}`; };
const money = v => 'R$ ' + (Math.round((Number(v) || 0) * 100) / 100).toFixed(2).replace('.', ',').replace(/,00$/, '');
const CHECK_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
function payCfg() {
  const p = (S.turma && S.turma.pay) || {};
  const n = (v, d) => { const x = Number(v); return Number.isFinite(x) && x >= 0 ? Math.min(x, 5000) : d; };
  return {
    on: p.on === true, mensal: n(p.mensal, 0), avulso: n(p.avulso, 0),
    venc: clamp(Math.round(n(p.venc, 10)), 1, 28), prazoH: clamp(Math.round(n(p.prazoH, 20)), 0, 23),
    pixTipo: ['aleatoria', 'celular', 'cpf', 'email'].includes(p.pixTipo) ? p.pixTipo : 'aleatoria',
    pixKey: str(p.pixKey, 77), pixNome: str(p.pixNome, 25), pixCidade: str(p.pixCidade, 15) || 'Curitiba',
    recebedor: str(p.recebedor, 80), inicio: /^\d{4}-\d{2}$/.test(p.inicio || '') ? p.inicio : ymNow(),
    mensalistas: Array.isArray(p.mensalistas) ? p.mensalistas.filter(x => typeof x === 'string').slice(0, 300) : [],
    desde: p.desde && typeof p.desde === 'object' ? p.desde : {}

}
const payOn = () => FBM() && !!S.turma && payCfg().on;
const isMensalista = id => payCfg().mensalistas.includes(id);
const recebedorNome = () => { const c = payCfg(); return (c.recebedor && personName(c.recebedor)) || 'quem organiza'; };

// ---------- Vaga garantida: até o prazo da véspera, mensalista que confirmou passa na frente ----------
function cutoffOf(g) { return new Date(`${addDays(g.date, -1)}T${pad(payCfg().prazoH)}:00`).getTime(); }
function confAt(g, id) { const r = (S.rosters[g.id] || {})[id]; return r && r.at ? r.at : 0; }
function confOrder(g) {
  const conf = g.conf.filter(P);
  if (!payOn() || !g.max) return conf;
  const cut = cutoffOf(g), mens = new Set(payCfg().mensalistas);
  const first = conf.filter(id => mens.has(id) && confAt(g, id) <= cut);
  return first.concat(conf.filter(id => !first.includes(id)));
}

// ---------- Fichas de pagamento ----------
const pagoId = (t, pid) => `pg_${t}_${pid}`;
const pagoOf = pid => S.pagos[pagoId(S.turmaId, pid)] || null;
function payState(pid, key) {
  const d = pagoOf(pid); let mark = null, claim = 0;
  for (const [u, e] of Object.entries((d && d.roster) || {})) {
    if (!e || typeof e !== 'object') continue;
    const s = e.s && e.s[key];
    // A marcação da própria pessoa só vale se ela for admin: ninguém se dá baixa sozinho.
    if (s && typeof s.at === 'number' && ['pago', 'isento', 'pend'].includes(s.st) && (u !== pid || isAdminUid(u)) && (!mark || s.at > mark.at)) mark = s;
    if (u === pid && e.c && typeof e.c[key] === 'number') claim = Math.max(claim, e.c[key]);
  }
  if (mark && mark.at >= claim) return { st: mark.st, at: mark.at, claim };
  if (claim) return { st: 'avisou', at: claim, claim };
  return { st: 'pend', at: 0, claim: 0 };
}
function pagoNew(pid) {
  const vis = new Set([...(String(pid).startsWith('g_') ? [] : [pid]), ...((S.turma && S.turma.admins) || []), meId()]);
  return { kind: 'pago', turma: S.turmaId, pid, createdBy: meId(), visibleTo: [...vis], votes: {}, conf: [], created: Date.now(), date: todayStr() };
}
function setLocalPago(pid, uid, entry) {
  const id = pagoId(S.turmaId, pid), d = S.pagos[id] || Object.assign(pagoNew(pid), { id, roster: {} });
  d.roster = Object.assign({}, d.roster || {}, { [uid]: entry }); S.pagos[id] = d;
}
async function savePagoEntry(pid, entry) {
  setLocalPago(pid, meId(), entry); render(); if (S.ui.sheet) renderSheet();
  await window.MCloud.pagoEntry(pagoId(S.turmaId, pid), meId(), entry, pagoNew(pid));
}
// Quem criou a ficha mantém a lista de quem pode ler em dia com os admins atuais.
function refreshPagos() {
  if (!FBM() || !S.turma || !window.MCloud.pagoVis) return;
  for (const d of [...Object.values(S.pagos), ...Object.values(S.notasDocs), ...Object.values(S.contests)]) {
    if (d.createdBy !== meId() || d.turma !== S.turmaId) continue;
    const want = d.kind === 'notas' || d.kind === 'contest' ? [...new Set([meId(), ...(S.turma.admins || [])])] : [...new Set([...(String(d.pid).startsWith('g_') ? [] : [d.pid]), ...(S.turma.admins || []), meId()])];
    const cur = d.visibleTo || [];
    if (want.length !== cur.length || want.some(u => !cur.includes(u))) { d.visibleTo = want; window.MCloud.pagoVis(d.id, want).catch(() => { }); }
  }
}

// ---------- Quanto e o quê cada um deve ----------
function seriesDays(ym) {
  const gs = Object.values(S.games).filter(g => g.serie).sort(byDate), all = Object.values(S.games).sort(byDate);
  const ref = gs[gs.length - 1] || all[all.length - 1];
  if (!ref) return [];
  const wd = new Date(ref.date + 'T12:00').getDay(), out = [];
  for (let d = 1; d <= 31; d++) { const ds = `${ym}-${pad(d)}`, dt = new Date(ds + 'T12:00'); if (dt.getMonth() + 1 !== +ym.slice(5, 7)) break; if (dt.getDay() === wd) out.push(ds); }
  return out;
}
function mensalValor(pid, ym) {
  const c = payCfg(), desde = c.desde[pid];
  if (desde && ymOf(desde) === ym && desde > `${ym}-01`) {
    const days = seriesDays(ym);
    if (days.length) return Math.round(c.mensal * days.filter(d => d >= desde).length / days.length * 100) / 100;
  }
  return c.mensal;
}
function mensalMeses(pid) {
  const c = payCfg(); let from = c.inicio; const d = c.desde[pid]; if (d && ymOf(d) > from) from = ymOf(d);
  const out = []; for (let ym = from, i = 0; ym <= ymNow() && i < 24; ym = ymAdd(ym, 1), i++) out.push(ym);
  return out;
}
const vencOf = ym => `${ym}-${pad(payCfg().venc)}`;
const payKeyOf = (g, id) => isMensalista(id) ? 'm:' + ymOf(g.date) : 'g:' + g.id;
function leftLate(g, id) { const r = (S.rosters[g.id] || {})[id]; return !!(r && r.hadSpot && r.left > cutoffOf(g)); }
function avulsoJogos(pid) {
  const c = payCfg(), now = Date.now(), ini = c.inicio + '-01', out = [];
  for (const g of Object.values(S.games)) {
    if (g.date < ini || now <= cutoffOf(g) || isMensalista(pid)) continue;
    if (confOrder(g).slice(0, g.max || undefined).includes(pid) || leftLate(g, pid)) out.push(g);
  }
  return out.sort(byDate);
}
function payKeyLabel(key) {
  if (key.startsWith('m:')) { const n = mesNome(key.slice(2)); return n.charAt(0).toUpperCase() + n.slice(1); }
  const g = S.games[key.slice(2)]; return g ? `Jogo de ${fmtDay(g.date).toLowerCase()}` : 'Jogo';
}
const payKeyValor = (pid, key) => key.startsWith('m:') ? mensalValor(pid, key.slice(2)) : payCfg().avulso;
const payKeyVenc = key => key.startsWith('m:') ? vencOf(key.slice(2)) : ((S.games[key.slice(2)] || {}).date || todayStr());
function myPayDue() {
  if (!payOn() || !P(meId())) return null;
  const c = payCfg(), me = meId(), open = k => ['pend', 'avisou'].includes(payState(me, k).st);
  if (isMensalista(me)) {
    if (!c.mensal) return null;
    const meses = mensalMeses(me).filter(ym => open('m:' + ym));
    if (!meses.length) return null;
    return { key: 'm:' + meses[0], valor: mensalValor(me, meses[0]), st: payState(me, 'm:' + meses[0]), outros: meses.slice(1).map(ym => 'm:' + ym) };
  }
  if (!c.avulso) return null;
  const gs = avulsoJogos(me).filter(g => open('g:' + g.id));
  if (!gs.length) return null;
  return { key: 'g:' + gs[0].id, valor: c.avulso, st: payState(me, 'g:' + gs[0].id), outros: gs.slice(1).map(g => 'g:' + g.id) };
}
function payClaims() {
  if (!payOn() || !isTurmaAdmin()) return [];
  const out = [];
  for (const d of Object.values(S.pagos)) {
    if (d.turma !== S.turmaId) continue;
    const mine = (d.roster || {})[d.pid];
    for (const key of Object.keys((mine && mine.c) || {})) { const st = payState(d.pid, key); if (st.st === 'avisou') out.push({ pid: d.pid, key, at: st.claim }); }
  }
  return out.sort((a, b) => b.at - a.at);

// ---------- Pix copia e cola (padrão BR Code do Banco Central) ----------
function crc16(str) {
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++) { crc ^= str.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF; }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
function pixCode({ key, amount, name, city, txid }) {
  const f = (id, v) => id + String(v.length).padStart(2, '0') + v;
  const ascii = v => norm(v).toUpperCase().replace(/[^A-Z0-9 .-]/g, '').replace(/\s+/g, ' ').trim();
  let p = f('00', '01') + f('26', f('00', 'br.gov.bcb.pix') + f('01', key)) + f('52', '0000') + f('53', '986');
  if (amount > 0) p += f('54', Number(amount).toFixed(2));
  p += f('58', 'BR') + f('59', ascii(name).slice(0, 25) || 'RECEBEDOR') + f('60', ascii(city).slice(0, 15) || 'BRASIL');
  p += f('62', f('05', String(txid || '***').replace(/[^A-Za-z0-9*]/g, '').slice(0, 25) || '***')) + '6304';
  return p + crc16(p);
}
function pixKeyNorm(c) {
  const k = String(c.pixKey || '').trim(), dig = k.replace(/\D/g, '');
  if (c.pixTipo === 'celular') return dig.startsWith('55') && dig.length >= 12 ? '+' + dig : '+55' + dig;
  if (c.pixTipo === 'cpf') return dig;
  return k.toLowerCase();
}

// ---------- Telas ----------
function payChip(pid, key) {
  const st = payState(pid, key).st, c = payCfg();
  let cls, txt;
  if (st === 'pago') { cls = 'ok'; txt = CHECK_SVG + 'Pago'; }
  else if (st === 'isento') { cls = 'mute'; txt = key.startsWith('m:') ? `Isento em ${mesNome(key.slice(2))}` : 'Não cobrado'; }
  else if (st === 'avisou') { cls = 'warn'; txt = 'Avisou, confirmar'; }

    const late = todayStr() > payKeyVenc(key), p = P(pid);
    cls = late ? 'due' : 'dash';
    txt = key.startsWith('m:') ? (late ? `Deve ${mesNome(key.slice(2))}` : `A pagar até dia ${c.venc}`) : (p && p.guest ? 'Marcar pago' : (late ? `Deve ${money(c.avulso)}` : `${money(c.avulso)} a pagar`));
  }
  return `<button class="pst pst-${cls}" data-act="paySheet" data-pid="${esc(pid)}" data-key="${esc(key)}" aria-label="Pagamento de ${esc(nameOf(pid))}">${txt}</button>`;
}

  else h += `<p class="sub small" style="margin:0">Você paga para ${esc(who)}, direto no seu banco. O código já vai com o valor certo.</p><div style="display:grid;gap:8px;margin-top:4px"><button class="btn btn-block btn-ball" data-act="payPix" data-key="${esc(d.key)}">${ICON.copy}Pagar com Pix</button><button class="btn btn-block" data-act="payClaim" data-key="${esc(d.key)}">Já paguei</button></div>`;
  if (d.outros.length) h += `<p class="sub small" style="margin:0">Também em aberto: ${d.outros.map(k => esc(payKeyLabel(k).toLowerCase())).join(', ')}.</p>`;
  return h + '</section>';
}
function presencaPay(g) {
  const W = canEditGame(g), admin = isTurmaAdmin(), c = payCfg(), mens = new Set(c.mensalistas);
  const order = confOrder(g), max = g.max || Infinity, spots = order.slice(0, max), wait = order.slice(max);
  const cut = cutoffOf(g), past = Date.now() > cut, key = id => payKeyOf(g, id);
  const charged = id => mens.has(id) || past;
  const confSet = new Set(g.conf);
  const others = Object.keys(S.players).map(P).filter(p => !confSet.has(p.id) && isActive(p.id) && invitedTo(g, p) && (!privacyOn() || p.known)).sort((a, b) => (a.nick || a.name).localeCompare(b.nick || b.name, 'pt-BR'));

    h += `<div class="pay-sum"><div class="row" style="align-items:baseline;gap:6px"><span class="pay-big num">${spots.length}</span><span class="sub small">${g.max ? `de ${g.max} vagas` : 'confirmados'}</span><span class="spacer"></span><span class="pay-big num">${okN}</span><span class="sub small">de ${pool.length} em dia</span></div>
      <div class="pay-bar"><i style="width:${pool.length ? Math.round(100 * okN / pool.length) : 0}%"></i></div>
      <p class="sub small" style="margin:0">Avulsos ${past ? 'garantidos desde' : 'ficam garantidos'} ${esc(fmtDay(addDays(g.date, -1)).toLowerCase())}, ${c.prazoH}h. Só os admins veem os pagamentos. <button class="link-btn" data-act="payMes" data-ym="${esc(ymOf(g.date))}">Ver o mês</button></p></div>`;
    const f = S.ui.payFilter || '';

function processPhoto(file) {
  if (!file || !/^image\//.test(file.type)) return toast('Escolha uma imagem.');
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const size = 240, c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    const s = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
    let data = c.toDataURL('image/jpeg', 0.78);
    if (data.length > 150000) data = c.toDataURL('image/jpeg', 0.55);
    let big = '';
    if (FBM()) {
      const make = max => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const cb = document.createElement('canvas'); cb.width = Math.round(img.width * k); cb.height = Math.round(img.height * k);
        cb.getContext('2d').drawImage(img, 0, 0, cb.width, cb.height);
        return cb;
      };
      let cb = make(1080); big = cb.toDataURL('image/jpeg', 0.8);
      if (big.length > 480000) big = cb.toDataURL('image/jpeg', 0.65);
      if (big.length > 800000) { cb = make(800); big = cb.toDataURL('image/jpeg', 0.7); }
      if (big.length > 900000) big = '';
    }
    URL.revokeObjectURL(url);
    if (!S.ui.form) return;
    S.ui.form.photo = data; S.ui.form.photoBig = big;
    keepFormInputs(() => renderSheet());
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Não consegui abrir essa imagem.'); };
  img.src = url;
}

    const f = S.ui.form; if (!f || f.pid) return;
    f.level = el.dataset.level; f.at = presetAt(f.level, f.pos, f.max || 90); f.preset = true;
    keepFormInputs(() => renderSheet());
  },
  pickPhoto: () => { const i = $('#photoInput'); i.value = ''; i.click(); },
  removePhoto: () => { if (!S.ui.form) return; S.ui.form.photo = ''; S.ui.form.photoBig = ''; keepFormInputs(() => renderSheet()); },
  savePlayer: () => {
    const f = S.ui.form; if (!f) return;
    const name = $('#pName').value.trim().slice(0, 60), nick = $('#pNick').value.trim().slice(0, 16);
    if (!name) { $('#pErr').textContent = 'Escreva o nome do jogador.'; $('#pName').focus(); return; }
    const hTxt = (($('#pHeight') || {}).value || '').replace(/\D/g, ''), aTxt = (($('#pAge') || {}).value || '').replace(/\D/g, '');
    const height = hTxt ? Number(hTxt) : null, age = aTxt ? Number(aTxt) : null;
    if (height != null && (height < 120 || height > 230)) { $('#pErr').textContent = 'Altura em centímetros, entre 120 e 230. Exemplo: 182.'; $('#pHeight').focus(); return; }
    if (age != null && (age < 8 || age > 90)) { $('#pErr').textContent = 'Idade entre 8 e 90.'; $('#pAge').focus(); return; }
    const birthYear = age != null ? new Date().getFullYear() - age : null;
    const bad = document.querySelector('.rng-num.bad');
    if (bad) { $('#pErr').textContent = 'Tem nota fora da faixa permitida. Corrija o número em vermelho.'; bad.focus(); return; }
    const cap = f.max || 90;
    if (f.pid && RAW(f.pid)) {
      const raw = RAW(f.pid);
      if (!canEditPlayer(P(f.pid))) return closeSheet();
      const hadPhoto = !!(raw.photo || (P(raw.id) && P(raw.id).photo));
      Object.assign(raw, { name, nick, pos: f.pos, pos2: f.pos2.slice(), photo: f.photo, height, birthYear: age != null ? (ageOf(raw) === age ? raw.birthYear : birthYear) : null, updated: Date.now() });
      if (f.notes === 'base') { const at = {}; for (const a of ATTRS) at[a] = clamp(Math.round(f.at[a]), 40, cap); raw.base = { at, forma: null }; }
      else if (f.notes === 'adj') {
        const changed = {};
        for (const a of ATTRS) if (Math.abs(f.at[a] - f.start[a]) > 1e-9) changed[a] = clamp(Math.round(f.at[a]), 40, 99);
        if (Object.keys(changed).length) raw.adj = (raw.adj || []).concat([{ t: adjTime(), at: changed }]);
      }
      if (privacyOn()) { S.profiles[raw.id] = profileFrom(raw); dirty(); }
      persist('players', raw.id, 0, () => { savePhotoBig(raw.id, f, hadPhoto); saveProfile(raw.id); }); closeSheet(); render(); toast(f.kind === 'self' ? 'Sua carta foi salva.' : 'Jogador salvo.');

    const id = f.kind === 'self' ? meId() : f.kind === 'guest' ? 'g_' + uid('') : uid('p');

    persist('players', p.id, 0, () => { savePhotoBig(p.id, f, false); saveProfile(p.id); });
    const gid = f.forGame;
    if (gid && S.games[gid] && S.games[gid].status !== 'encerrado') {
      if (FBM()) presenceSet(S.games[gid], p.id, true);
      else { S.games[gid].conf.push(p.id); persist('games', gid); }
    }
    closeSheet(); render();
    toast(f.kind === 'self' ? `Sua carta está no elenco: ${ovrOf(P(p.id))}.` : `Carta de ${p.nick || p.name} criada: ${ovrOf(P(p.id))}.`);

  askDeletePlayer: el => {
    const id = el.dataset.pid;
    if (!canEditPlayer(P(id)) || (FBM() && !(P(id) || {}).guest)) return;
    openSheet({ type: 'confirm', title: 'Apagar jogador?', text: `${nameOf(id)} sai do elenco e das listas de presença dos próximos jogos. Os jogos com placar continuam valendo para os outros.`, ok: 'Apagar jogador', danger: true, run: () => {
      delete S.players[id]; persist('players', id);

      for (const g of Object.values(S.games)) {
        if (g.status === 'encerrado') continue;

        if (FBM()) { if (canEditGame(g)) { g.paid = g.paid.filter(x => x !== id); presenceSet(g, id, false); } continue; }
        g.conf = g.conf.filter(x => x !== id); g.paid = g.paid.filter(x => x !== id); persist('games', g.id);
      }

  }
};
const CHG = {
  score: el => {
    const g = curGame(); if (!g || !canEditGame(g)) return;
    const i = Number(el.dataset.i), f = el.dataset.f;
    if (!g.sets[i]) return;
    const v = el.value === '' ? null : clamp(parseInt(el.value, 10) || 0, 0, 99);
    if (g.sets[i][f] !== v) bumpRev(g);
    g.sets[i][f] = v;
    if (v != null && String(v) !== el.value) el.value = v;
    persist('games', g.id, 400);
    const tot = $('#setTotal'); if (tot) tot.textContent = scoreline(g) || '';
  },
  setTeam: el => {
    const g = curGame(); if (!g || !canEditGame(g)) return;
    const i = Number(el.dataset.i), f = el.dataset.f, v = Number(el.value);
    const s = g.sets[i]; if (!s) return;
    const other = f === 'a' ? 'b' : 'a';
    if (s[other] === v) s[other] = s[f];
    s[f] = v; bumpRev(g);
    persist('games', g.id); render();
  }
};
function numCheck(el, leaving) {
  const a = el.dataset.attr, max = Number(el.dataset.max);
  const raw = el.value.replace(/\D/g, '').slice(0, 2);
  if (raw !== el.value) el.value = raw;
  const v = raw === '' ? NaN : Number(raw);
  let msg = '';
  if (!Number.isNaN(v) && v > max) msg = max === 80 ? 'Na sua própria carta o máximo é 80. Acima disso, só jogando.' : max === 90 ? 'No cadastro o máximo é 90. Acima disso, só jogando.' : 'O máximo é 99.';
  else if ((raw.length === 2 || (leaving && raw !== '')) && v < 40) msg = 'O mínimo é 40.';
  el.classList.toggle('bad', !!msg);
  const er = $('#e_' + a); if (er) er.textContent = msg;
  if (!msg && raw.length === 2 && v !== formValue(a)) rngCommit($('#r_' + a), v);
  if (leaving && raw === '') { el.value = formValue(a); el.classList.remove('bad'); if (er) er.textContent = ''; }
}
const INP = {
  pScore: el => {
    const p = S.partidas[el.dataset.id], i = Number(el.dataset.i); if (!p || !myPartida(p) || !p.sets[i]) return;
    const v = el.value.trim() === '' ? null : clamp(parseInt(el.value, 10) || 0, 0, 99);
    p.sets[i][el.dataset.f] = v; clearTimeout(INP._pt); INP._pt = setTimeout(() => savePartida(p), 500);
  },
  peopleQ: el => { S.ui.peopleQ = el.value.slice(0, 80); showLocalHits(); clearTimeout(SEARCH_T); SEARCH_T = setTimeout(runSearch, 350); },
  pname: () => updateFormPreview(),
  num: el => numCheck(el, false)
};
document.addEventListener('click', e => {
  if (e.target && e.target.dataset && e.target.dataset.sheetbg) return closeSheet();
  const el = e.target.closest && e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el, e);
});
document.addEventListener('change', e => { const el = e.target.closest && e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el, e); });
document.addEventListener('input', e => { const el = e.target.closest && e.target.closest('[data-input]'); if (el && INP[el.dataset.input]) INP[el.dataset.input](el, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#tour').innerHTML) { closeTour(); return; }
  if (e.key === 'Escape' && $('#zoom').innerHTML) { $('#zoom').innerHTML = ''; return; }
  if (e.key === 'Escape' && S.ui.sheet) closeSheet();
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('rng-num')) { e.preventDefault(); e.target.blur(); }
});
// Ao tocar no número, o campo esvazia e mostra o valor atual de fundo: é só digitar o novo.
document.addEventListener('focusin', e => {
  const t = e.target;
  if (!t.classList || !t.classList.contains('rng-num')) return;
  t.placeholder = t.value; t.value = '';
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (!t.classList || !t.classList.contains('rng-num')) return;
  numCheck(t, true);
  t.placeholder = '';
});
$('#photoInput').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) processPhoto(f); });
$('#backupInput').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) readBackup(f); });

boot();
