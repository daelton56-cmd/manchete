<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10294A">
<title>Manchete</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Manchete">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#E7ECF3; --ink:#0F2240; --muted:#53647E; --line:rgba(15,34,64,.13); --line-strong:rgba(15,34,64,.28);
  --ball:#F7C531; --ball-ink:#2E2300; --zone:#D9541E; --pos:#14845A; --neg:#C2410C; --focus:#2D5BD8;
  --board:#10294A; --board-ink:#F3F6FB; --board-muted:#9DB0CB; --board-line:rgba(255,255,255,.11);
  --display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',Impact,sans-serif;
  --text:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --star-on:#EDB100; --star-off:rgba(15,34,64,.13);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D2240; --surface:#14305A; --surface-2:#1A3A68; --ink:#F1F5FB; --muted:#A3B5CF; --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.26);
    --ball:#F7C531; --ball-ink:#2E2300; --zone:#FF8A57; --pos:#4ADE9A; --neg:#FF9466; --focus:#9CC0FF;
    --board:#081A33; --board-line:rgba(255,255,255,.1); --star-on:#F7C531; --star-off:rgba(255,255,255,.15); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D2240; --surface:#14305A; --surface-2:#1A3A68; --ink:#F1F5FB; --muted:#A3B5CF; --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.26);
  --ball:#F7C531; --ball-ink:#2E2300; --zone:#FF8A57; --pos:#4ADE9A; --neg:#FF9466; --focus:#9CC0FF;
  --board:#081A33; --board-line:rgba(255,255,255,.1); --star-on:#F7C531; --star-off:rgba(255,255,255,.15); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--text); font-size:16px; line-height:1.45; -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit; color:inherit}
button,a,input,select,textarea,label{touch-action:manipulation}
button{cursor:pointer; border:0; background:none; padding:0}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px}
img{max-width:100%}
.wrap{max-width:560px; margin:0 auto; padding:0 16px calc(84px + env(safe-area-inset-bottom,0px))}

/* Topo */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line)}
.top-in{max-width:560px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px; min-height:56px}
.mark{font-family:var(--display); font-weight:900; font-size:30px; letter-spacing:.01em; line-height:1; flex:1; display:flex; align-items:center; gap:8px}
.mark i{display:inline-block; width:20px; height:20px; border-radius:50%; background:var(--ball); position:relative; overflow:hidden; flex:none}
.mark i::before,.mark i::after{content:""; position:absolute; border:2px solid var(--ball-ink); border-radius:50%; opacity:.55}
.mark i::before{width:24px; height:24px; left:-12px; top:-6px}
.mark i::after{width:24px; height:24px; right:-14px; top:4px}
.mode{font-size:12px; color:var(--muted); text-align:right; line-height:1.2}
.icon-btn{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--ink); border:1px solid var(--line)}
.icon-btn svg{width:20px; height:20px}
.me-btn{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; padding:0; box-shadow:0 0 0 2px var(--ball)}
.me-btn .av{width:36px; height:36px}
.me-card{display:grid; grid-template-columns:150px 1fr; gap:16px; align-items:center; margin-bottom:6px}
.board .btn.board-ghost{background:transparent; color:var(--board-ink); border:1px solid var(--board-line)}
.back{display:flex; align-items:center; gap:6px; font-weight:600; font-size:15px; padding:8px 4px; margin-left:-4px}
.back svg{width:18px; height:18px}

/* Abas */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs::after{content:""; position:absolute; left:0; right:0; top:100%; height:160px; background:var(--surface); pointer-events:none}
.tabs-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr)}
.tab{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0 9px; font-size:12px; font-weight:600; color:var(--muted)}
.tab svg{width:24px; height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--ink)}
.tab[aria-current="page"] span{box-shadow:inset 0 -2px 0 var(--ball)}

/* Tipografia */
h1,h2,h3{margin:0; font-weight:600}
.h-sec{font-family:var(--display); font-weight:800; font-size:24px; line-height:1.1; margin:26px 0 10px; letter-spacing:.005em}
.sub{color:var(--muted); font-size:14px}
.small{font-size:13px}
.num{font-family:var(--display); font-weight:800; letter-spacing:.01em}
p{margin:0 0 10px}

/* Botões */
.btn{text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:0 18px; border-radius:12px; font-weight:600; font-size:16px; background:var(--surface); border:1px solid var(--line-strong); color:var(--ink)}
.btn svg{width:18px; height:18px}
.btn-ball{background:var(--ball); color:var(--ball-ink); border-color:transparent}
.btn-ghost{background:transparent}
.btn-danger{color:var(--neg); border-color:currentColor; background:transparent}
.btn-block{width:100%}
.btn-sm{min-height:36px; padding:0 12px; font-size:14px; border-radius:10px}
.btn:disabled{opacity:.45; cursor:default}
.row{display:flex; gap:10px; align-items:center}
.row-wrap{display:flex; gap:8px; flex-wrap:wrap}
.spacer{flex:1}
.chip{display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--line-strong); font-size:14px; font-weight:600; background:transparent}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

/* Placar (hero) */
.board{background:var(--board); color:var(--board-ink); border-radius:18px; padding:18px 18px 16px; position:relative; overflow:hidden; margin-top:16px}
.board::before{content:""; position:absolute; inset:0; pointer-events:none;
  background:
   linear-gradient(var(--board-line),var(--board-line)) 50% 0/1px 100% no-repeat,
   linear-gradient(var(--board-line),var(--board-line)) 33% 0/1px 100% no-repeat,
   linear-gradient(var(--board-line),var(--board-line)) 67% 0/1px 100% no-repeat}
.board > *{position:relative}
.board-label{font-size:13px; color:var(--board-muted); font-weight:600}
.board-when{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:4px 0 6px}
.board-day{font-family:var(--display); font-weight:800; font-size:34px; line-height:.95}
.board-time{font-family:var(--display); font-weight:900; font-size:58px; line-height:.85; color:var(--ball)}
.board-place{color:var(--board-muted); font-size:15px; margin-bottom:14px}
.board .btn{background:var(--ball); color:var(--ball-ink); border-color:transparent}
.stack{display:flex; padding-left:8px}
.stack .av{margin-left:-8px; border:2px solid var(--board)}
.conf-line{display:flex; align-items:center; gap:10px; margin-bottom:14px; font-size:15px}

/* Avatares */
.av{width:32px; height:32px; border-radius:50%; overflow:hidden; display:grid; place-items:center; font-size:12px; font-weight:600; background:var(--surface-2); color:var(--ink); flex:none}
.av img{width:100%; height:100%; object-fit:cover}

/* Listas */
.list{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.item{display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:1px solid var(--line); width:100%; text-align:left; min-height:56px}
.item:first-child{border-top:0}
.item-main{flex:1; min-width:0}
.item-title{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item-sub{color:var(--muted); font-size:14px}
.chev{width:16px; height:16px; color:var(--muted); flex:none}
.date-box{width:48px; flex:none; text-align:center; border-right:1px solid var(--line); padding-right:10px}
.date-box b{display:block; font-family:var(--display); font-weight:800; font-size:26px; line-height:1}
.date-box span{font-size:12px; color:var(--muted); font-weight:600}
.pill{display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted)}
.pill-done{background:transparent; border:1px solid var(--line-strong)}

.empty{border:1px dashed var(--line-strong); border-radius:16px; padding:22px 18px; text-align:left}
.empty h3{font-family:var(--display); font-weight:800; font-size:24px; margin-bottom:6px}
.banner{border-radius:12px; padding:10px 14px; font-size:14px; margin-top:12px; background:var(--surface-2); display:flex; gap:10px; align-items:center}

/* Passos do jogo */
.game-head{padding-top:6px}
.game-title{font-family:var(--display); font-weight:800; font-size:34px; line-height:1}
.steps{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; background:var(--surface-2); border-radius:12px; padding:4px; margin:16px 0 4px; position:sticky; top:calc(57px + env(safe-area-inset-top,0px)); z-index:10}
.step{border-radius:9px; padding:8px 2px; font-size:13px; font-weight:600; color:var(--muted); display:flex; flex-direction:column; align-items:center; line-height:1.15}
.step b{font-family:var(--display); font-size:17px; font-weight:800}
.step[aria-current="step"]{background:var(--surface); color:var(--ink)}

/* Presença */
.pres{display:flex; align-items:center; gap:12px; padding:10px 12px; border-top:1px solid var(--line); min-height:58px}
.pres:first-child{border-top:0}
.pres-n{width:22px; text-align:right; font-family:var(--display); font-weight:800; font-size:18px; color:var(--muted)}
.pres-ovr{font-size:17px; color:var(--muted); margin-left:2px}
.toggle{min-width:88px; min-height:44px; border-radius:10px; border:1px solid var(--line-strong); font-weight:600; font-size:14px}
.toggle[aria-pressed="true"]{background:var(--ball); color:var(--ball-ink); border-color:transparent}
.paid{min-height:44px; padding:0 10px; border-radius:10px; font-size:13px; font-weight:600; color:var(--muted); border:1px dashed var(--line-strong)}
.paid[aria-pressed="true"]{color:var(--pos); border:1px solid currentColor}
.wait{font-size:12px; font-weight:600; color:var(--zone)}

/* Times */
.teams{display:grid; gap:12px}
.team{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.team-head{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line)}
.team-dot{width:14px; height:14px; border-radius:4px; flex:none}
.team-name{font-weight:600; flex:1}
.team-avg{font-family:var(--display); font-weight:800; font-size:22px}
.tp{display:flex; align-items:center; gap:10px; padding:8px 14px; width:100%; text-align:left; border-top:1px solid var(--line)}
.team-head + .tp{border-top:0}
.tp[aria-pressed="true"]{background:var(--surface-2); box-shadow:inset 3px 0 0 var(--ball)}
.tp-tag{display:block; font-size:12px; font-weight:600; color:var(--zone)}
.tp-out .tp-name,.tp-out .tp-ovr{opacity:.5}
.join-btn{min-height:38px; padding:0 12px 0 10px; border-radius:10px; border:1px solid var(--line-strong); font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px}
.join-btn::before{content:""; width:10px; height:10px; border-radius:3px; background:var(--tc)}
.tp-pos{font-size:12px; font-weight:600; color:var(--muted); width:30px}
.tp-name{flex:1; font-weight:500}
.tp-ovr{font-family:var(--display); font-weight:800; font-size:20px}
.seg{display:inline-flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:3px}
.seg button{min-width:42px; min-height:34px; border-radius:8px; font-weight:600; font-size:14px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink)}

/* Súmula */
.scout-players{display:grid; grid-template-columns:repeat(auto-fill,minmax(98px,1fr)); gap:8px}
.sp{min-height:48px; border-radius:10px; border:1px solid var(--line-strong); padding:6px 8px; text-align:left; display:flex; flex-direction:column; justify-content:center; position:relative; background:var(--surface)}
.sp::before{content:""; position:absolute; left:0; top:8px; bottom:8px; width:4px; border-radius:0 3px 3px 0; background:var(--tc)}
.sp-name{font-weight:600; font-size:14px; padding-left:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sp-n{font-size:12px; color:var(--muted); padding-left:4px}
.sp[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.sp[aria-pressed="true"] .sp-n{color:inherit; opacity:.75}
.ev-grid{display:grid; gap:10px; margin-top:14px}
.ev-row{display:grid; grid-template-columns:96px 1fr 1fr; gap:8px; align-items:stretch}
.ev-row.one{grid-template-columns:96px 1fr}
.ev-attr{align-self:center; font-weight:600; font-size:14px}
.ev{min-height:58px; border-radius:12px; font-weight:600; font-size:15px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; border:1.5px solid}
.ev.plus{border-color:var(--pos); color:var(--pos)}
.ev.minus{border-color:var(--neg); color:var(--neg)}
.ev b{font-family:var(--display); font-size:24px; font-weight:800}
.ev:active{transform:scale(.97)}
.flash{min-height:22px; font-size:14px; font-weight:600; margin-top:10px}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{padding:8px 10px; text-align:right; white-space:nowrap; border-top:1px solid var(--line)}
thead th{border-top:0; font-size:12px; color:var(--muted); font-weight:600}
th:first-child,td:first-child{text-align:left}
td .num{font-size:18px}
.rk{gap:8px; text-align:left}
.rk-n{width:20px; color:var(--muted); font-size:17px}
.rk-name{display:flex; flex-direction:column; line-height:1.2; max-width:110px}
.rk-name b{font-weight:600; overflow:hidden; text-overflow:ellipsis}
.rk-name span{font-size:12px; color:var(--muted); font-weight:600}
.rank-tbl th,.rank-tbl td{padding:8px 7px}

/* Placar dos sets */
.set{display:grid; grid-template-columns:44px 1fr auto 1fr 36px; gap:8px; align-items:center; padding:10px 12px; border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set-n{font-weight:600; font-size:13px; color:var(--muted)}
.set-side{display:flex; align-items:center; gap:8px; min-width:0}
.set-side.r{flex-direction:row-reverse}
.score{width:56px; height:48px; padding:0; text-align:center; -moz-appearance:textfield; appearance:textfield; border-radius:10px; border:1px solid var(--line-strong); background:var(--bg); font-family:var(--display); font-weight:800; font-size:26px}
.score::-webkit-inner-spin-button,.score::-webkit-outer-spin-button{-webkit-appearance:none; margin:0}
.set-x{color:var(--muted); font-weight:600}
.set select{max-width:100%; min-height:36px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); font-size:13px; padding:0 4px}
.set-multi{grid-template-rows:auto auto; row-gap:10px}
.m-n{grid-column:1; grid-row:1 / span 2; align-self:center}
.m-a{grid-column:2; grid-row:1; width:100%}
.m-x{grid-column:3; grid-row:1 / span 2; align-self:center}
.m-b{grid-column:4; grid-row:1; width:100%}
.m-del{grid-column:5; grid-row:1 / span 2; align-self:center}
.m-pa{grid-column:2; grid-row:2}
.m-pb{grid-column:4; grid-row:2; justify-content:flex-end}
.del{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:var(--muted)}
.del svg{width:16px; height:16px}
.total{font-family:var(--display); font-weight:800; font-size:30px; text-align:center; margin:14px 0 4px}

/* Cartas */
.cards{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
@media (min-width:520px){.cards{grid-template-columns:repeat(3,1fr)}}
.card-btn{display:block; width:100%; text-align:left}
.card{--c-bg:#CBD3DD; --c-ink:#1E2A3A; --c-sub:#445468; --c-net:rgba(30,42,58,.25); --c-frame:rgba(30,42,58,.35);
  position:relative; container-type:inline-size; aspect-ratio:5/7; width:100%; background:var(--c-bg); color:var(--c-ink); border-radius:12px; overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%); display:flex; flex-direction:column; padding:9% 9% 7%}
.card::before{content:""; position:absolute; left:0; right:0; top:0; height:56%; pointer-events:none;
  background-image:repeating-linear-gradient(45deg,var(--c-net) 0 1px,transparent 1px 10px),repeating-linear-gradient(-45deg,var(--c-net) 0 1px,transparent 1px 10px);
  -webkit-mask-image:linear-gradient(#000 20%,transparent); mask-image:linear-gradient(#000 20%,transparent); opacity:.75}
.card::after{content:""; position:absolute; inset:5px; border:1px solid var(--c-frame); border-radius:8px; pointer-events:none;
  clip-path:polygon(0 0,calc(100% - 15px) 0,100% 15px,100% 100%,0 100%)}
.card > *{position:relative}
.card-top{display:flex; justify-content:space-between; align-items:flex-start; flex:1}
.card-ovr{display:flex; flex-direction:column; line-height:1}
.card-ovr b{font-family:var(--display); font-weight:900; font-size:42px; font-size:30cqw; line-height:.82}
.card-ovr small{font-weight:600; font-size:12px; font-size:8.5cqw; color:var(--c-sub); margin-top:3px}
.trend{font-size:11px; font-size:7.5cqw; font-weight:600; margin-top:3px}
.card-photo{width:52%; aspect-ratio:1; border-radius:50%; overflow:hidden; display:grid; place-items:center; background:var(--c-frame); border:2px solid var(--c-sub); margin-top:4%}
.card-photo img{width:100%; height:100%; object-fit:cover}
.card-zoom{padding:0; cursor:zoom-in}
.tour{position:fixed; inset:0; z-index:90; background:var(--bg); display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top,0px) + 10px) 0 calc(env(safe-area-inset-bottom,0px) + 16px)}
.tour::after{content:""; position:absolute; left:0; right:0; top:100%; height:160px; background:var(--bg); pointer-events:none}
.tour-top{display:flex; align-items:center; justify-content:space-between; padding:0 16px; min-height:44px}
.tour-step{font-size:13px; font-weight:600; color:var(--muted)}
.tour-skip{font-weight:600; font-size:15px; color:var(--muted); padding:10px 4px}
.tour-slides{flex:1; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; overscroll-behavior-x:contain}
.tour-slides::-webkit-scrollbar{display:none}
.tour-slide{flex:0 0 100%; width:100%; scroll-snap-align:center; scroll-snap-stop:always; display:flex; flex-direction:column; justify-content:center; padding:0 24px}
.tour-inner{width:100%; max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
.tour-art{display:flex; justify-content:center; align-items:center; min-height:230px}
.tour-title{font-family:var(--display); font-weight:800; font-size:36px; line-height:1.02}
.tour-text{color:var(--muted); font-size:17px; line-height:1.5; margin:0}
.tour-dots{display:flex; gap:8px; justify-content:center; margin:14px 0 18px}
.tour-dots i{width:8px; height:8px; border-radius:4px; background:var(--line-strong); transition:width .2s,background .2s}
.tour-dots i.on{width:26px; background:var(--ball)}
.tour-bottom{padding:0 16px; max-width:560px; width:100%; margin:0 auto}
.tour-board{width:100%; max-width:300px; margin:0}
.tour-score{display:grid; gap:8px; width:100%; max-width:300px}

<script>

'use strict';
const ATTRS = ['saq', 'rec', 'lev', 'ata', 'blo', 'def'];
const ATTR = {
  saq: { abbr: 'SAQ', name: 'Saque' },
  rec: { abbr: 'REC', name: 'Recepção' },
  lev: { abbr: 'LEV', name: 'Levantamento' },
  ata: { abbr: 'ATA', name: 'Ataque' },
  blo: { abbr: 'BLO', name: 'Bloqueio' },
  def: { abbr: 'DEF', name: 'Defesa' }
};
const POS = {
  lev: { abbr: 'LEV', name: 'Levantador', w: { lev: .45, def: .15, saq: .15, rec: .10, ata: .10, blo: .05 } },
  pon: { abbr: 'PON', name: 'Ponteiro', w: { ata: .30, rec: .25, def: .15, saq: .15, blo: .10, lev: .05 } },
  cen: { abbr: 'CEN', name: 'Central', w: { blo: .35, ata: .30, saq: .15, def: .10, rec: .05, lev: .05 } },
  opo: { abbr: 'OPO', name: 'Oposto', w: { ata: .40, blo: .20, saq: .20, def: .10, rec: .05, lev: .05 } },
  lib: { abbr: 'LÍB', name: 'Líbero', w: { rec: .40, def: .40, lev: .10, saq: .10, ata: 0, blo: 0 } },
  cor: { abbr: 'COR', name: 'Coringa', w: { saq: 1 / 6, rec: 1 / 6, lev: 1 / 6, ata: 1 / 6, blo: 1 / 6, def: 1 / 6 } }
};
const EVENTS = {
  ace: { attr: 'saq', sign: 1, label: 'Ace', short: 'Ace' },
  es: { attr: 'saq', sign: -1, label: 'Erro de saque', short: 'Erro' },
  ep: { attr: 'rec', sign: -1, label: 'Erro de passe', short: 'Erro de passe' },
  el: { attr: 'lev', sign: -1, label: 'Erro de levantamento', short: 'Erro de toque' },
  ap: { attr: 'ata', sign: 1, label: 'Ponto de ataque', short: 'Ponto' },
  ea: { attr: 'ata', sign: -1, label: 'Erro de ataque', short: 'Erro' },
  bl: { attr: 'blo', sign: 1, label: 'Ponto de bloqueio', short: 'Ponto de bloqueio' },
  df: { attr: 'def', sign: 1, label: 'Defesa', short: 'Defesa' }
};
const EVENT_KEYS = Object.keys(EVENTS);
const EXPECT = { saq: [-1.5, 1.0], rec: [-2.0, -0.2], lev: [-1.5, -0.1], ata: [-1.0, 2.0], blo: [0.0, 0.8], def: [0.3, 2.5] };
const NOTA_W = { ace: 1.0, ap: 1.0, bl: 1.2, df: 0.5, es: -0.8, ea: -0.8, ep: -0.8, el: -0.8 };
const TIERS = [
  { key: 'bronze', name: 'Bronze', min: 0 },
  { key: 'prata', name: 'Prata', min: 65 },
  { key: 'ouro', name: 'Ouro', min: 75 },
  { key: 'elite', name: 'Elite', min: 85 },
  { key: 'lenda', name: 'Lenda', min: 93 }
];

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const r1 = v => Math.round(v * 10) / 10;
const starsToAttr = s => clamp(42 + (s - 1) * 12, 40, 99);

function tecnica(p) {
  const w = (POS[p.pos] || POS.cor).w;
  let t = 0;
  for (const a of ATTRS) t += (w[a] || 0) * (p.at?.[a] ?? 60);
  return t;
}
function ovrRaw(p) {
  const f = typeof p.forma === 'number' ? p.forma : tecnica(p);
  return 0.7 * tecnica(p) + 0.3 * f;
}
function ovrOf(p) { return Math.round(ovrRaw(p)); }
function tierOf(ovr) {
  let t = TIERS[0];
  for (const x of TIERS) if (ovr >= x.min) t = x;
  return t;
}
function expectedNet(attr, A) {
  const [lo, hi] = EXPECT[attr];
  return lo + ((clamp(A, 40, 99) - 40) / 59) * (hi - lo);
}
function statDelta(attr, A, net, sets, f = 1) {
  if (!sets) return 0;
  const c = Math.min(sets, 4) / 4;
  let d = 2 * (net / sets - expectedNet(attr, A)) * c * f;
  d = clamp(d, -4 * f, 4 * f);
  d *= d > 0 ? Math.min(1, (99 - A) / 20) : Math.min(1, (A - 40) / 20);
  return d;
}
function setFormaDelta(rTeam, rOpp, won, margin) {
  const E = 1 / (1 + Math.pow(10, (rOpp - rTeam) / 20));
  const m = 1 + Math.min(Math.abs(margin), 10) / 20;
  return 2 * m * ((won ? 1 : 0) - E);
}
function eligible(attr, p, counts) {
  if (attr === 'lev') return p.pos === 'lev' || (counts.el || 0) > 0;
  if ((attr === 'ata' || attr === 'blo') && p.pos === 'lib') return false;
  return true;
}
function countsFromLog(log) {
  const c = {};
  for (const ev of log || []) {
    if (!EVENTS[ev.e]) continue;
    c[ev.p] = c[ev.p] || {};
    c[ev.p][ev.e] = (c[ev.p][ev.e] || 0) + 1;
  }
  return c;
}
function emptyTot() {
  const t = { jogos: 0, sets: 0, setsV: 0, mvp: 0, notaSum: 0, notaN: 0 };
  for (const k of EVENT_KEYS) t[k] = 0;
  return t;
}

// Calcula o resultado de um jogo sem gravar nada.
function computeResult(game, playersById, opts = {}) {
  const calib = opts.calib || {};
  const teams = game.teams || [];
  const teamOf = {};
  teams.forEach((t, i) => t.forEach(pid => { if (playersById[pid]) teamOf[pid] = i; }));
  const members = Object.keys(teamOf);
  const pre = {};
  for (const pid of members) pre[pid] = ovrOf(playersById[pid]);
  const teamR = teams.map(t => {
    const v = t.filter(pid => pre[pid] != null).map(pid => pre[pid]);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 60;
  });
  const join = game.join || {}, leave = game.leave || {};
  const active = (pid, i) => i >= (join[pid] || 0) && i < (leave[pid] == null ? Infinity : leave[pid]);
  const sp = {}, sw = {}, formaD = {};
  for (const pid of members) { sp[pid] = 0; sw[pid] = 0; formaD[pid] = 0; }
  (game.sets || []).forEach((s, i) => {
    if (!s || s.pa == null || s.pb == null || s.pa === '' || s.pb === '') return;
    const pa = Number(s.pa), pb = Number(s.pb);
    if (!Number.isFinite(pa) || !Number.isFinite(pb) || pa === pb) return;
    if (s.a == null || s.b == null || s.a === s.b || !teams[s.a] || !teams[s.b]) return;
    const rOf = ti => {
      const v = teams[ti].filter(pid => pre[pid] != null && active(pid, i)).map(pid => pre[pid]);
      return v.length ? v.reduce((x, y) => x + y, 0) / v.length : teamR[ti];
    };
    const R = { [s.a]: rOf(s.a), [s.b]: rOf(s.b) };
    const sides = [[s.a, s.b, pa, pb], [s.b, s.a, pb, pa]];
    for (const [ti, oi, mine, theirs] of sides) {
      const d = setFormaDelta(R[ti], R[oi], mine > theirs, mine - theirs);
      for (const pid of teams[ti]) {
        if (sp[pid] == null || !active(pid, i)) continue;
        sp[pid] += 1;
        if (mine > theirs) sw[pid] += 1;
        formaD[pid] += d * (calib[pid] || 1);
      }
    }
  });
  const counts = countsFromLog(game.log);
  const track = game.track || [];
  const out = {};
  for (const pid of members) {
    const p = playersById[pid];
    const c = counts[pid] || {};
    const sets = sp[pid];
    const atBefore = { ...p.at };
    const atAfter = { ...p.at };
    const why = {};
    if (sets > 0) {
      for (const attr of track) {
        if (!eligible(attr, p, c)) continue;
        let net = 0;
        for (const k of EVENT_KEYS) if (EVENTS[k].attr === attr) net += EVENTS[k].sign * (c[k] || 0);
        const d = statDelta(attr, atBefore[attr], net, sets, calib[pid] || 1);
        atAfter[attr] = r1(clamp(atBefore[attr] + d, 40, 99));
        why[attr] = { net, perSet: net / sets, expected: expectedNet(attr, atBefore[attr]), d };
      }
    }
    const formaBefore = typeof p.forma === 'number' ? p.forma : tecnica(p);
    const formaAfter = r1(clamp(formaBefore + formaD[pid], 40, 99));
    const after = { ...p, at: atAfter, forma: formaAfter };
    let nota = null;
    if (sets > 0) {
      let sum = 0;
      for (const k of EVENT_KEYS) if (track.includes(EVENTS[k].attr)) sum += (NOTA_W[k] || 0) * (c[k] || 0);
      const won = sw[pid], lost = sets - won;
      nota = r1(clamp(6.5 + 1.2 * sum / sets + (won - lost) / sets, 3, 10));
    }
    out[pid] = {
      team: teamOf[pid], sets, won: sw[pid], counts: c, why, nota,
      ovrBefore: pre[pid], ovrAfter: ovrOf(after), rawDelta: r1(ovrRaw(after) - ovrRaw(p)),
      atBefore, atAfter, formaBefore: r1(formaBefore), formaAfter
    };
  }
  // Prêmios
  const ids = members.filter(pid => out[pid].sets > 0);
  const best = (score, min = 1) => {
    let top = null, val = -Infinity;

  return `<div class="card t-${tier.key} ${opt.size ? 'card-' + opt.size : ''}">
    <div class="card-top"><div class="card-ovr"><b>${ovr}</b><small>${pos.abbr}</small>${tr}</div>${photoBox}</div>
    <div class="card-name">${esc(p.nick || p.name)}</div>

}
const section = (title, inner, extra = '') => `<h2 class="h-sec">${esc(title)}</h2>${extra}${inner}`;
const listBox = items => `<div class="list">${items.join('')}</div>`;
function gameRow(g) {
  const d = parseDate(g.date);

  const sub = (g.vis === 'privada' && FBM() ? 'Privada. ' : '') + (sl ? esc(sl) + (mvp ? `<br>MVP: ${esc(mvp)}` : '') : esc(g.place || 'Local a definir'));
  return `<button class="item" data-act="openGame" data-id="${esc(g.id)}">

}
function banners() {
  let h = '';

  if (S.migrateOffer && S.canWrite) h += `<div class="banner"><span class="spacer">Encontrei dados de antes salvos neste aparelho.</span><button class="btn btn-sm btn-ball" data-act="migrate">Enviar para a nuvem</button></div>`;
  if (S.mode === 'local' && needsBackup()) h += `<div class="banner"><span class="spacer">${lastBackup() ? 'Seu último backup tem mais de 2 semanas.' : 'Os dados ficam só neste celular.'} Salve um backup para não perder nada.</span><button class="btn btn-sm btn-ball" data-act="backup">Salvar backup</button></div>`;

// ---------- Telas ----------
function render() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#view') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { S.ui.pendingRender = true; return; }
  S.ui.pendingRender = false;
  renderTop(); renderTabs();
  try { $('#view').innerHTML = viewHTML(); ensureLocks(); waitPromotion(); }
  catch (err) {
    console.error(err);
    $('#view').innerHTML = `<div class="empty" style="margin-top:16px"><h3>Essa tela travou</h3><p class="sub">Algum dado veio diferente do esperado. Volte para o início e tente de novo.</p><button class="btn" data-act="home">Voltar para os jogos</button></div>`;
  }
}
document.addEventListener('focusout', () => setTimeout(() => { if (S.ui.pendingRender) render(); }, 320));
function renderTop() {
  const g = curGame();
  const mode = S.mode === 'local' ? 'Neste aparelho' : (S.mode === 'cloud' && !S.canWrite ? 'Só leitura' : '');
  $('#top').innerHTML = g
    ? `<button class="back" data-act="home">${ICON.back}Jogos</button><span class="spacer"></span>${canEditGame(g) ? `<button class="btn btn-sm" data-act="editGame">Editar jogo</button>` : ''}`
    : `<div class="mark"><i aria-hidden="true"></i>Manchete</div>${mode && !FBM() ? `<div class="mode">${esc(mode)}</div>` : ''}${FBM() && !['cloud', 'no-turma'].includes(S.mode) ? '' : `<button class="icon-btn" data-act="help" aria-label="Como funciona">${ICON.help}</button>`}${FB() ? `<button class="me-btn" data-act="perfil" aria-label="Sua carta e sua turma">${P(meId()) ? avatar(P(meId())) : `<span class="av">${esc(initials({ name: S.me.name || '?' }))}</span>`}</button>` : ''}`;
}
function renderTabs() {
  if (FBM() && S.mode !== 'cloud') { $('#tabs').innerHTML = ''; return; }
  const t = S.ui.gameId ? 'jogos' : S.ui.tab;
  const tab = (k, label, icon) => `<button class="tab" data-act="tab" data-tab="${k}" ${t === k ? 'aria-current="page"' : ''}>${icon}<span>${label}</span></button>`;
  $('#tabs').innerHTML = tab('jogos', 'Jogos', ICON.cal) + tab('elenco', 'Elenco', ICON.cards) + tab('ranking', 'Ranking', ICON.podium);
}
function viewHTML() {
  if (S.loadErr && S.mode === 'loading-cloud') return `<div class="empty" style="margin-top:16px"><h3>Não consegui carregar</h3><p class="sub">Os dados da galera não chegaram. Confira a internet e tente de novo.</p><button class="btn btn-ball" data-act="reload">Tentar de novo</button></div>`;
  if (S.mode === 'loading' || S.mode === 'loading-cloud' || S.mode === 'auth-wait') return `<div class="loading">Carregando a quadra…</div>`;
  if (S.mode === 'signed-out') return authView();
  if (S.mode === 'no-turma') return noTurmaView();
  const g = curGame();
  if (g) return g.status === 'encerrado' ? finalView(g) : gameView(g);
  if (S.ui.tab === 'elenco') return elencoView();
  if (S.ui.tab === 'ranking') return rankingView();
  return agendaView();
}

function authView() {

  const isNew = S.authTab === 'criar';

    <div class="board-label">${inv ? 'Você foi convidado' : 'Bem-vindo'}</div>

  </section>
  ${!standalone() && /iPhone|iPad/.test(navigator.userAgent) ? `<div class="banner">No iPhone, toque em compartilhar e em <b>Adicionar à Tela de Início</b> antes de entrar. Depois abra pelo ícone.</div>` : ''}
  <div class="seg seg-full" role="group" aria-label="Entrar ou criar conta" style="margin:18px 0 14px;grid-template-columns:1fr 1fr">

}
function myTurmasList(currentId) {

}

  ${section('Tenho um convite', `<label class="field"><span>Link de convite</span><input class="input" id="tLink" autocapitalize="off" spellcheck="false" placeholder="Cole o link aqui"></label><button class="btn btn-block" data-act="joinByLink">Entrar na turma</button>`)}
  <div class="err" role="alert" id="tErr"></div>

}

  if (!Object.keys(S.players).length && S.canWrite) h += `<div class="empty" style="margin-top:20px"><h3>Cadastre a galera</h3><p class="sub">Cada jogador ganha uma carta. Depois é só confirmar presença e sortear os times.</p><button class="btn" data-act="newPlayer">${ICON.plus}Novo jogador</button></div>`;

function heroHTML(g) {

    <div class="board-place">${esc(g.place || 'Local a definir')}</div>
    <div class="conf-line">${conf.length ? `<div class="stack">${conf.slice(0, 7).map(id => avatar(P(id))).join('')}</div>` : ''}<span>${confTxt}</span></div>
    ${hasResult(g) ? `<div class="board-place" style="margin:0 0 12px;color:var(--board-ink)"><b>${esc(scoreline(g) || '')}</b>. ${canConfirm(g) ? 'Confere e confirma o placar?' : pendingConfirm(g) ? 'Falta confirmar o placar.' : 'Placar lançado.'}</div>
      <div style="display:grid;grid-template-columns:${canConfirm(g) ? '1fr 1fr' : '1fr'};gap:10px">${canConfirm(g) ? `<button class="btn" data-act="confirmScore" data-id="${esc(g.id)}">Confirmar placar</button>` : ''}<button class="btn ${canConfirm(g) ? 'board-ghost' : ''}" data-act="openGame" data-id="${esc(g.id)}">Abrir jogo</button></div>`

      ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn board-ghost" data-act="heroPres" data-id="${esc(g.id)}">Desmarcar</button><button class="btn" data-act="openGame" data-id="${esc(g.id)}">Abrir jogo</button></div><div class="board-place" style="margin:10px 0 0">${myState}</div>`
      : `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn" data-act="heroPres" data-id="${esc(g.id)}">Vou jogar</button><button class="btn board-ghost" data-act="openGame" data-id="${esc(g.id)}">Abrir jogo</button></div>`)

function elencoView() {
  const mine = FB() ? P(meId()) : null;
  const ps = Object.keys(S.players).map(P).filter(p => !mine || p.id !== mine.id);

  if (!ps.length) {
    return h + `<div class="empty" style="margin-top:16px"><h3>${FB() ? 'Só você por aqui' : 'Ninguém no elenco'}</h3><p class="sub">${FB() ? 'Mande o link da turma para a galera. Cada um cria a própria carta.' : 'Cadastre cada jogador com uma nota de 40 a 90 em cada fundamento. A carta nasce daí e evolui a cada jogo.'}</p>${FB() ? `<div class="row-wrap"><button class="btn btn-ball" data-act="shareInvite">${ICON.copy}Convidar a galera</button>${mine ? `<button class="btn" data-act="newGuest">${ICON.plus}Convidado sem conta</button>` : ''}</div>` : (S.canWrite ? `<button class="btn btn-ball" data-act="newPlayer">${ICON.plus}Novo jogador</button>` : '')}</div>`;
  }
  const sorters = { ovr: (a, b) => ovrOf(b) - ovrOf(a), nome: (a, b) => (a.nick || a.name).localeCompare(b.nick || b.name, 'pt-BR'), pos: (a, b) => Object.keys(POS).indexOf(a.pos) - Object.keys(POS).indexOf(b.pos) || ovrOf(b) - ovrOf(a) };
  ps.sort(sorters[S.ui.sort] || sorters.ovr);
  const chip = (k, l) => `<button class="chip" data-act="sort" data-sort="${k}" aria-pressed="${S.ui.sort === k}">${l}</button>`;
  const mvp = mvpId();
  if (mine) h += `<div class="row" style="align-items:flex-end;margin:26px 0 10px"><h2 class="h-sec" style="margin:0;flex:1">A galera</h2><button class="btn btn-sm" data-act="newGuest">${ICON.plus}Convidado</button></div>`;
  h += `<div class="row" style="margin:${mine ? '0' : '16px'} 0 12px"><div class="row-wrap">${chip('ovr', 'Geral')}${chip('nome', 'Nome')}${chip('pos', 'Posição')}</div><span class="spacer"></span>${FB() ? '' : (S.canWrite ? `<button class="btn btn-sm btn-ball" data-act="newPlayer">${ICON.plus}Jogador</button>` : '')}</div>`;
  h += `<div class="cards">${ps.map(p => `<button class="card-btn" data-act="openPlayer" data-pid="${esc(p.id)}" aria-label="${esc(p.name)}, geral ${ovrOf(p)}">${cardHTML(p, { destaque: p.id === mvp })}</button>`).join('')}</div>`;
  h += `<p class="sub small" style="margin-top:14px">${plural(ps.length + (mine ? 1 : 0), 'jogador', 'jogadores')}. Toque numa carta para ver a evolução.${FB() ? ' Convidado é quem joga sem conta, e a carta dele fica com quem criou.' : ''}</p>`;
  return h;
}

function rankingView() {
  const ps = Object.keys(S.players).map(P);
  if (!ps.length) return banners() + `<div class="empty" style="margin-top:16px"><h3>Ranking vazio</h3><p class="sub">O ranking aparece quando o elenco tiver jogadores.</p></div>`;
  const pct = p => p.tot.sets ? p.tot.setsV / p.tot.sets : -1;
  const avg = p => p.tot.notaN ? p.tot.notaSum / p.tot.notaN : -1;
  const sorters = { ovr: (a, b) => ovrOf(b) - ovrOf(a), vit: (a, b) => pct(b) - pct(a) || b.tot.sets - a.tot.sets, nota: (a, b) => avg(b) - avg(a), pres: (a, b) => b.tot.jogos - a.tot.jogos || ovrOf(b) - ovrOf(a) };
  ps.sort(sorters[S.ui.rankSort] || sorters.ovr);
  const chip = (k, l) => `<button class="chip" data-act="rankSort" data-sort="${k}" aria-pressed="${S.ui.rankSort === k}">${l}</button>`;
  const rows = ps.map((p, i) => `<tr>
    <td><button class="row rk" data-act="openPlayer" data-pid="${esc(p.id)}"><span class="num rk-n">${i + 1}</span>${avatar(p)}<span class="rk-name"><b>${esc(p.nick || p.name)}</b><span>${(POS[p.pos] || POS.cor).abbr}</span></span></button></td>
    <td><span class="num">${ovrOf(p)}</span></td>
    <td>${p.tot.jogos}</td>
    <td>${p.tot.sets ? Math.round(pct(p) * 100) + '%' : '–'}</td>
    <td>${p.tot.notaN ? fmtN(avg(p)) : '–'}</td>
  </tr>`).join('');
  return banners() + `<div class="row-wrap" style="margin:16px 0 12px">${chip('ovr', 'Geral')}${chip('vit', 'Vitórias')}${chip('nota', 'Nota')}${chip('pres', 'Presença')}</div>
  <div class="tbl-wrap"><table class="rank-tbl"><thead><tr><th>Jogador</th><th>Geral</th><th>Jogos</th><th>Vit.</th><th>Nota</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="sub small" style="margin-top:10px">Vit. é a porcentagem de sets vencidos. Nota é a média das notas de 0 a 10 dos jogos com placar.</p>`;
}

// ---------- Jogo ----------
function confirmBox(g) {
  if (!pendingConfirm(g) && !(FB() && needsConfirm(g) && gameCounts(g))) return '';
  if (gameCounts(g)) { const who = confirmers(g).map(nameOf).join(', '); return `<div class="banner">Placar confirmado por ${esc(who)}. Os pontos já estão nas cartas.</div>`; }
  if (accountIds(g).length < 4) return `<div class="banner" style="border:1px solid var(--zone);background:transparent">Esta partida não entra nas cartas: precisa de pelo menos 4 jogadores com conta nos times.</div>`;
  if (canConfirm(g)) return `<div class="banner" style="border:1px solid var(--ball);background:transparent;flex-wrap:wrap"><span class="spacer">O placar foi ${esc(scoreline(g) || '')}. Confere e confirma?</span><button class="btn btn-sm btn-ball" data-act="confirmScore" data-id="${esc(g.id)}">Confirmar placar</button></div>`;
  return `<div class="banner" style="border:1px solid var(--zone);background:transparent">Os pontos entram nas cartas quando alguém de outro time confirmar o placar.</div>`;
}
function gameHead(g) {
  return `<div class="game-head">
    <div class="game-title">${fmtDay(g.date)}, ${fmtTime(g.time)}</div>
    <div class="sub" style="margin-top:4px">${esc(g.place || 'Local a definir')}${g.note ? '<br>' + esc(g.note) : ''}</div>
  </div>`;
}
function gameView(g) {
  const step = S.ui.step || (g.teams ? (g.log.length || g.sets.length ? 'sumula' : 'times') : 'presenca');
  S.ui.step = step;
  const conf = g.conf.filter(P).length;
  const st = (k, n, l) => `<button class="step" data-act="step" data-step="${k}" ${step === k ? 'aria-current="step"' : ''}><b>${n}</b>${l}</button>`;
  let h = gameHead(g) + confirmBox(g);
  h += `<nav class="steps" aria-label="Etapas do jogo">${st('presenca', 1, 'Presença')}${st('times', 2, 'Times')}${st('sumula', 3, 'Súmula')}${st('placar', 4, 'Placar')}</nav>`;
  if (step === 'presenca') h += presencaStep(g, conf);
  else if (step === 'times') h += timesStep(g);
  else if (step === 'sumula') h += sumulaStep(g);
  else h += placarStep(g);
  return h;
}
function presencaStep(g, confN) {
  const W = canEditGame(g);
  const conf = g.conf.filter(P);
  const confSet = new Set(conf);

// ---------- Relatório ----------
function whyLines(r) {
  const out = [];
  for (const a of ATTRS) {
    const b = Math.round(r.atBefore[a]), af = Math.round(r.atAfter[a]);
    if (!r.why || !r.why[a]) continue;
    const evs = EVENT_KEYS.filter(k => EVENTS[k].attr === a).map(k => { const n = (r.counts || {})[k] || 0; return n + ' ' + (n === 1 ? EV_PL[k][0] : EV_PL[k][1]); });
    const dd = r.atAfter[a] - r.atBefore[a];
    out.push(`${ATTR[a].name} ${b} → ${af} (${dd >= 0 ? '+' : '−'}${fmtN(Math.abs(dd))}): ${evs.join(', ')} em ${plural(r.sets, 'set', 'sets')}.`);
  }
  const fd = r.formaAfter - r.formaBefore;
  out.push(`Forma ${fd >= 0 ? '+' : '−'}${fmtN(Math.abs(fd))}: ganhou ${r.won} de ${plural(r.sets, 'set', 'sets')}.`);
  return out;
}
function reportBody(rows, mvp, awards, ctx) {
  const ids = Object.keys(rows).sort((a, b) => ((rows[b].nota ?? -1) - (rows[a].nota ?? -1)) || ((rows[b].ovrAfter - rows[b].ovrBefore) - (rows[a].ovrAfter - rows[a].ovrBefore)));
  let h = '';
  if (mvp && P(mvp) && rows[mvp]) {
    const p = { ...P(mvp), at: rows[mvp].atAfter, forma: rows[mvp].formaAfter, last: { g: '', d: rows[mvp].ovrAfter - rows[mvp].ovrBefore } };
    h += `<div class="mvp" style="margin:6px 0 4px">${cardHTML(p, { destaque: true })}<div><div class="sub">MVP da rodada</div><div class="game-title" style="font-size:30px">${esc(nameOf(mvp))}</div><div class="sub">Nota <b class="num" style="font-size:22px;color:var(--ink)">${fmtN(rows[mvp].nota)}</b></div></div></div>`;
  }
  const aw = (awards || []).filter(a => a.key !== 'mvp' && P(a.pid));
  if (aw.length) h += section('Prêmios', `<div class="awards">${aw.map(a => `<div class="award"><div class="item-main"><b>${esc(a.name)}</b><div class="sub">${esc(nameOf(a.pid))}</div></div><span class="num" style="font-size:22px">${a.key === 'evoluiu' ? '+' + fmtN(a.val) : a.val}</span><span class="sub small">${esc(a.unit)}</span></div>`).join('')}</div>`);
  h += section('Jogadores', listBox(ids.map(id => {
    const r = rows[id];
    const d = r.ovrAfter - r.ovrBefore;
    const open = S.ui.openRep === id;
    return `<button class="rep" data-act="repToggle" data-pid="${esc(id)}" data-ctx="${ctx}" aria-expanded="${open}">
      <span class="team-dot" style="background:${(TEAMS[r.team] || TEAMS[0]).c}"></span>
      <span class="nota ${id === mvp ? 'hi' : ''}">${r.nota == null ? '–' : fmtN(r.nota)}</span>
      <span class="item-main"><span class="item-title" style="display:block">${esc(nameOf(id))}</span><span class="item-sub">${r.ovrBefore} → ${r.ovrAfter}</span></span>
      <span class="delta ${d > 0 ? 'up' : d < 0 ? 'down' : 'eq'}">${d > 0 ? '+' + d : d < 0 ? '−' + Math.abs(d) : '='}</span>
    </button>${open ? `<div class="rep-detail">${r.sets ? whyLines(r).map(l => `<div>${esc(l)}</div>`).join('') : '<div>Não jogou nenhum set registrado.</div>'}</div>` : ''}`;
  })), `<p class="sub small" style="margin:-4px 0 10px">Nota de 0 a 10 pelo que foi anotado e pelos sets vencidos. Toque num jogador para ver por que a carta mudou.</p>`);
  return h;
}

  <h3>Como a súmula mexe na carta</h3><p>No jogo você escolhe o que vai anotar e toca no jogador e no lance. No fim, o app calcula o saldo de cada um por set e compara com o esperado para o nível da carta. Quem foi melhor que o esperado sobe, quem foi pior desce. Por isso um 90 que erra um saque por set desce, e um 60 que erra o mesmo tanto mexe pouco.</p>

function spark(v) {

// ---------- Lista do WhatsApp ----------
const norm = v => String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function cleanLine(line) {
  return norm(line).replace(/\(.*?\)|\[.*?\]/g, ' ').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim().replace(/^(\d+\s*)+/, '').trim();
}
function matchList(text) {
  const idx = Object.values(S.players).map(p => { const name = cleanLine(p.name), nick = cleanLine(p.nick); return { p, name, nick, first: name.split(' ')[0], nickFirst: nick.split(' ')[0] }; });
  const out = { matched: [], unknown: [], ambiguous: [] };
  for (const raw of String(text || '').split(/\r?\n/)) {
    const t = cleanLine(raw);
    if (!t) continue;
    const words = t.split(' ');
    if (words.length > 4) continue;
    const tries = [x => x.nick && x.nick === t, x => x.name === t, x => x.nick && x.nickFirst === words[0], x => x.first === words[0]];
    let found = null, amb = null;
    for (const f of tries) {
      const c = idx.filter(f);
      if (c.length === 1) { found = c[0].p; break; }
      if (c.length > 1) { amb = c.map(x => x.p); break; }
    }
    const label = raw.trim().replace(/^[\d\s.\-)–—•*#]+/, '').slice(0, 40);
    if (found) { if (!out.matched.includes(found.id)) out.matched.push(found.id); }
    else if (amb) out.ambiguous.push({ label, names: amb.map(p => p.nick || p.name) });
    else if (!/\d/.test(t) && !/(volei|lista|confirmad|espera|quadra|horario|local)/.test(t)) out.unknown.push(label);
  }
  return out;
}

const LS_BACKUP = 'manchete:lastBackup';
function lastBackup() { try { return localStorage.getItem(LS_BACKUP) || ''; } catch (e) { return ''; } }
function needsBackup() {

async function exportBackup() {
  const data = JSON.stringify({ app: 'manchete', v: 2, at: new Date().toISOString(), players: S.players, games: S.games });
  const name = `manchete-backup-${todayStr()}.json`;
  try {
    const file = new File([data], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Backup do Manchete' });
      markBackup(); render(); toast('Backup salvo.'); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    if (window.top === window) {
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);

function readBackup(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let d = null;
    try { d = JSON.parse(String(fr.result)); } catch (e) { }
    if (!d || d.app !== 'manchete' || typeof d.players !== 'object' || typeof d.games !== 'object' || !d.players || !d.games) return toast('Esse arquivo não é um backup do Manchete.');
    const players = {}, games = {};
    for (const [id, p] of Object.entries(d.players)) if (/^[\w.~:@+-]{1,60}$/.test(id)) players[id] = cleanPlayer(id, p);
    for (const [id, g] of Object.entries(d.games)) if (/^[\w.~:@+-]{1,60}$/.test(id)) games[id] = cleanGame(id, g);
    const when = typeof d.at === 'string' ? d.at.slice(0, 10) : '';
    openSheet({ type: 'confirm', title: 'Restaurar backup?',
      text: `${when ? 'Backup de ' + fmtDay(when).toLowerCase() + ', com ' : 'Backup com '}${plural(Object.keys(players).length, 'jogador', 'jogadores')} e ${plural(Object.keys(games).length, 'jogo', 'jogos')}. Ele substitui tudo o que está no app agora.`,
      ok: 'Restaurar', danger: true,
      run: () => {
        const oldP = Object.keys(S.players), oldG = Object.keys(S.games);
        S.players = players; S.games = games;
        S.ui.gameId = null;
        dirty(); upgradeData();
        for (const id of new Set(oldP.concat(Object.keys(players)))) persist('players', id);
        for (const id of new Set(oldG.concat(Object.keys(games)))) persist('games', id);
        closeSheet(); render(); toast('Backup restaurado.');
      } });
  };
  fr.onerror = () => toast('Não consegui ler esse arquivo.');
  fr.readAsText(file);
}

  if (!FB()) return;
  const me = meId();
  for (const g of Object.values(S.games)) {
    if (g.status === 'encerrado' || g.date < todayStr() || !g.max) continue;
    const pos = g.conf.filter(P).indexOf(me);
    const st = pos < 0 ? '' : (pos >= g.max ? 'espera' : 'vaga');
    const key = 'manchete:espera:' + me + ':' + g.id;
    let prev = '';
    try { prev = localStorage.getItem(key) || ''; if (st) localStorage.setItem(key, st); else localStorage.removeItem(key); } catch (e) { }
    if (prev === 'espera' && st === 'vaga') toast(`Abriu vaga: você está confirmado no jogo de ${fmtDay(g.date).toLowerCase()}.`);
  }
}

function presenceSet(g, id, on) {
  if (on) { if (!g.conf.includes(id)) g.conf.push(id); }
  else g.conf = g.conf.filter(x => x !== id);
  const paidChanged = !on && g.paid.includes(id) && canEditGame(g);
  if (paidChanged) g.paid = g.paid.filter(x => x !== id);
  dirty(); render();
  S.db.presence(g.id, id, on).catch(e => { toast(e && e.code === 'permission-denied' ? 'Você não tem permissão para isso.' : 'Não consegui salvar a presença. Tente de novo.'); resync(); });
  if (paidChanged) persist('games', g.id);
}

function gcalUrl(g) {
  const [y, m, d] = g.date.split('-').map(Number); const [hh, mm] = g.time.split(':').map(Number);
  const s = new Date(y, m - 1, d, hh, mm), e = new Date(y, m - 1, d, hh + 2, mm);
  const f = x => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  let tz = 'America/Sao_Paulo';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (er) { }
  const q = new URLSearchParams({ action: 'TEMPLATE', text: 'Vôlei', dates: `${f(s)}/${f(e)}`, location: g.place || '', details: g.note || '', ctz: tz });
  return 'https://calendar.google.com/calendar/render?' + q.toString();
}

// ---------- Foto ----------
function processPhoto(file) {
  if (!file || !/^image\//.test(file.type)) return toast('Escolha uma imagem.');
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const size = 240, c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    const s = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
    let data = c.toDataURL('image/jpeg', 0.78);
    if (data.length > 150000) data = c.toDataURL('image/jpeg', 0.55);
    let big = '';
    if (FBM()) {
      const make = max => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const cb = document.createElement('canvas'); cb.width = Math.round(img.width * k); cb.height = Math.round(img.height * k);
        cb.getContext('2d').drawImage(img, 0, 0, cb.width, cb.height);
        return cb;
      };
      let cb = make(1080); big = cb.toDataURL('image/jpeg', 0.8);
      if (big.length > 480000) big = cb.toDataURL('image/jpeg', 0.65);
      if (big.length > 800000) { cb = make(800); big = cb.toDataURL('image/jpeg', 0.7); }
      if (big.length > 900000) big = '';
    }
    URL.revokeObjectURL(url);
    if (!S.ui.form) return;
    S.ui.form.photo = data; S.ui.form.photoBig = big;
    keepFormInputs(() => renderSheet());
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Não consegui abrir essa imagem.'); };
  img.src = url;
}

  else if (!f.photo && hadPhoto) S.db.deletePhoto(id).catch(() => { });

<script type="module">
// Manchete: ponte com o Firebase (login por e-mail e senha + banco Firestore)
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, updateProfile, deleteUser, EmailAuthProvider, reauthenticateWithCredential } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, doc, collection, setDoc, getDoc, getDocs, deleteDoc, updateDoc, onSnapshot, writeBatch, arrayUnion, arrayRemove } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp(window.MANCHETE_FIREBASE);
const auth = initializeAuth(app, { persistence: [indexedDBLocalPersistence, browserLocalPersistence] });
let fs;
try { fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }) }); }
catch (e) { fs = initializeFirestore(app, {}); }

const userOf = u => u ? { uid: u.uid, email: u.email || '', name: u.displayName || (u.email || '').split('@')[0] } : null;
const fail = e => { const x = new Error((e && e.message) || 'erro'); x.code = (e && e.code) || 'unknown'; return x; };
const wrap = s => ({ docs: s.docs.map(d => ({ id: d.id, exists: true, data: () => d.data() })), size: s.size, empty: s.empty, metadata: { fromCache: s.metadata.fromCache, hasPendingWrites: s.metadata.hasPendingWrites } });
const code = () => { const a = new Uint8Array(10); crypto.getRandomValues(a); return Array.from(a, x => 'abcdefghjkmnpqrstuvwxyz23456789'[x % 31]).join(''); };
const guard = p => p.catch(e => { throw fail(e); });

window.MCloud = {
  onAuth: cb => onAuthStateChanged(auth, u => cb(userOf(u))),
  async signUp(name, email, pass) {
    try {
      const c = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(c.user, { displayName: name });
      await setDoc(doc(fs, 'users', c.user.uid), { name }, { merge: true });
      return { uid: c.user.uid, email, name };
    } catch (e) { throw fail(e); }
  },
  signIn: (email, pass) => guard(signInWithEmailAndPassword(auth, email, pass).then(c => userOf(c.user))),
  resetPassword: email => guard(sendPasswordResetEmail(auth, email)),
  signOut: () => guard(signOut(auth)),
  getUser: uid => guard(getDoc(doc(fs, 'users', uid)).then(s => (s.exists() ? s.data() : null))),
  setUser: (uid, data) => guard(setDoc(doc(fs, 'users', uid), data, { merge: true })),
  async createTurma(name, me) {
    const ref = doc(collection(fs, 'turmas'));
    const c = code();
    const b = writeBatch(fs);
    b.set(ref, { name, ownerUid: me.uid, admins: [me.uid], inviteCode: c, created: Date.now() });
    b.set(doc(fs, 'turmas', ref.id, 'membros', me.uid), { uid: me.uid, name: me.name, joinedAt: Date.now(), code: c });
    b.set(doc(fs, 'users', me.uid), { lastTurma: ref.id, turmas: arrayUnion(ref.id) }, { merge: true });
    await guard(b.commit());
    return { id: ref.id, inviteCode: c };
  },
  async joinTurma(t, c, me) {
    const mref = doc(fs, 'turmas', t, 'membros', me.uid);
    let already = false;
    try { already = (await getDoc(mref)).exists(); } catch (e) { already = false; }
    if (!already) await guard(setDoc(mref, { uid: me.uid, name: me.name, joinedAt: Date.now(), code: c }));
    await guard(setDoc(doc(fs, 'users', me.uid), { lastTurma: t, turmas: arrayUnion(t) }, { merge: true }));
  },
  async deleteAccount(pass) {
    const u = auth.currentUser;
    if (!u) throw fail({ code: 'auth/no-current-user' });
    try { await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, pass)); } catch (e) { throw fail(e); }
    let turmas = [];
    try { const s = await getDoc(doc(fs, 'users', u.uid)); turmas = (s.exists() && s.data().turmas) || []; } catch (e) { }
    for (const t of turmas) {
      try { await setDoc(doc(fs, 'turmas', t, 'players', u.uid), { name: 'Ex-jogador', nick: 'Ex-jogador', photo: '', height: null, birthYear: null }, { merge: true }); } catch (e) { }
      try { await deleteDoc(doc(fs, 'turmas', t, 'photos', u.uid)); } catch (e) { }
      try { await deleteDoc(doc(fs, 'turmas', t, 'membros', u.uid)); } catch (e) { }
    }
    try { await deleteDoc(doc(fs, 'users', u.uid)); } catch (e) { }
    await guard(deleteUser(u));
  },
  async leaveTurma(t, uid) {
    await guard(deleteDoc(doc(fs, 'turmas', t, 'membros', uid)));
    await guard(setDoc(doc(fs, 'users', uid), { turmas: arrayRemove(t), lastTurma: null }, { merge: true }));
  },
  async listTurmas(uid) {
    let ids = [];
    try { const s = await getDoc(doc(fs, 'users', uid)); ids = (s.exists() && s.data().turmas) || []; } catch (e) { }

    for (const id of ids) { try { const s = await getDoc(doc(fs, 'turmas', id)); if (s.exists()) out.push({ id, ...s.data() }); } catch (e) { } }
    return out;
  },
  renameTurma: (t, name) => guard(updateDoc(doc(fs, 'turmas', t), { name })),
  // Apaga a turma inteira: partidas, cartas e membros primeiro, e por último a própria turma.
  async deleteTurma(t, uid) {
    const refs = [];
    for (const kind of ['games', 'photos', 'players', 'membros']) {
      const s = await guard(getDocs(collection(fs, 'turmas', t, kind)));
      s.docs.forEach(d => { if (!(kind === 'membros' && d.id === uid)) refs.push(d.ref); });
    }
    for (let i = 0; i < refs.length; i += 400) { const b = writeBatch(fs); refs.slice(i, i + 400).forEach(r => b.delete(r)); await guard(b.commit()); }
    const b = writeBatch(fs);
    b.delete(doc(fs, 'turmas', t, 'membros', uid));
    b.delete(doc(fs, 'turmas', t));
    b.set(doc(fs, 'users', uid), { turmas: arrayRemove(t), lastTurma: null }, { merge: true });
    await guard(b.commit());
  },
  removeMember: (t, uid) => guard(deleteDoc(doc(fs, 'turmas', t, 'membros', uid))),
  async newInvite(t) { const c = code(); await guard(updateDoc(doc(fs, 'turmas', t), { inviteCode: c })); return c; },
  watchTurma: (t, next, error) => onSnapshot(doc(fs, 'turmas', t), s => next(s.exists() ? { id: s.id, ...s.data() } : null), e => error && error(fail(e))),
  watchMembers: (t, next, error) => onSnapshot(collection(fs, 'turmas', t, 'membros'), s => next(s.docs.map(d => d.data())), e => error && error(fail(e))),
  db(t) {
    return {
      collection: kind => ({ onSnapshot: (next, error) => onSnapshot(collection(fs, 'turmas', t, kind), s => next(wrap(s)), e => error && error(fail(e))) }),
      doc: path => {
        const [kind, id] = path.split('/');
        const ref = doc(fs, 'turmas', t, kind, id);
        return {
          // Partida: a presença (conf) nunca é sobrescrita aqui, só muda por presence/setConf.
          set: data => {
            if (kind !== 'games') return guard(setDoc(ref, data));
            const d = { ...data }; delete d.conf; delete d.confirms;
            return guard(setDoc(ref, d, { mergeFields: Object.keys(d) }));
          },
          delete: () => guard(deleteDoc(ref))
        };
      },
      presence: (gid, pid, on) => guard(updateDoc(doc(fs, 'turmas', t, 'games', gid), { conf: on ? arrayUnion(pid) : arrayRemove(pid) })),
      setConf: (gid, conf) => guard(updateDoc(doc(fs, 'turmas', t, 'games', gid), { conf })),
      // Confirmação do placar: cada um só grava a própria, presa à versão atual do placar.
      confirm: (gid, uid, rev) => guard(updateDoc(doc(fs, 'turmas', t, 'games', gid), { [`confirms.${uid}`]: rev })),
      // Trava das notas iniciais depois do primeiro jogo que vale.
      lockCard: pid => guard(updateDoc(doc(fs, 'turmas', t, 'players', pid), { locked: true })),
      // Foto grande fica separada da carta e só é baixada quando alguém abre a foto.
      getPhoto: pid => guard(getDoc(doc(fs, 'turmas', t, 'photos', pid)).then(s => (s.exists() ? s.data().big || '' : ''))),
      setPhoto: (pid, big) => guard(setDoc(doc(fs, 'turmas', t, 'photos', pid), { big, updated: Date.now() })),
      deletePhoto: pid => guard(deleteDoc(doc(fs, 'turmas', t, 'photos', pid)))
    };
  }
};
window.dispatchEvent(new Event('mcloud-ready'));

</script>
